<!DOCTYPE html>
<html lang="pt-PT">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Despesas">
<meta name="theme-color" content="#F4F5F2">
<title>Despesas da Casa</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{
  --bg:#EFEAE4; --card:#FBF9F6; --ink:#2B2622; --muted:#6B6058; --line:#EAE3DC; --line2:#D6CCC2;
  --taupe:#8B7D72; --accent:#5E5048; --accent-soft:#E7DFD6; --warn:#A64B4B; --sand:#C9B8A6;
  --hero:#4A3F37; --hero2:#5B4F46; --hero-sub:#DDD2C7;
  --safe-b:env(safe-area-inset-bottom,0px); --safe-t:env(safe-area-inset-top,0px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:Inter,system-ui,-apple-system,sans-serif;font-size:15px}
button,input,select{font-family:inherit;font-size:inherit;color:inherit}
button{cursor:pointer}
svg{flex:0 0 auto}
h1,.h1{font-family:'Space Grotesk',Inter,sans-serif;font-size:24px;font-weight:700;margin:0;letter-spacing:-.01em}
.app{display:flex;flex-direction:column;height:100%;max-width:560px;margin:0 auto}
.content{flex:1 1 auto;overflow-y:auto;padding:calc(16px + var(--safe-t)) 18px 24px}
.stack{display:flex;flex-direction:column;gap:16px}
.row{display:flex;align-items:center;gap:10px}
.between{justify-content:space-between}
.muted{color:var(--muted);font-size:13px}
.small{font-size:12px}
.card{background:var(--card);border-radius:20px;padding:14px 16px;box-shadow:0 1px 2px rgba(74,63,55,.06),0 4px 14px rgba(74,63,55,.05)}
.sec-title{display:flex;align-items:center;gap:8px;font-weight:700;font-size:15px}
.sec-title svg{color:var(--taupe)}
.hero{position:relative;overflow:hidden;background:linear-gradient(160deg,var(--hero2),var(--hero));color:#fff;border-radius:24px;padding:20px;display:flex;flex-direction:column;gap:10px;box-shadow:0 8px 24px rgba(74,63,55,.22)}
.hero .big{font-family:'Space Grotesk',Inter,sans-serif;font-size:40px;font-weight:700;position:relative}
.hero .sub{color:var(--hero-sub);font-size:13px;position:relative}
.hero .deco{position:absolute;right:-18px;top:-6px;opacity:.16;color:#fff;pointer-events:none}
.pill{flex:1;min-width:120px;background:rgba(255,255,255,.10);border-radius:14px;padding:10px 12px;display:flex;align-items:center;gap:10px;position:relative}
.pill b{font-size:15px;display:block}
.avatar{width:34px;height:34px;border-radius:17px;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;color:#fff;flex:0 0 auto}
.iconbtn{width:44px;height:44px;border-radius:22px;border:none;background:var(--card);display:flex;align-items:center;justify-content:center;color:var(--accent);box-shadow:0 1px 3px rgba(74,63,55,.1)}
.btn{min-height:50px;border-radius:16px;border:none;background:var(--accent);color:#fff;font-weight:600;font-size:16px;padding:0 18px;display:inline-flex;align-items:center;justify-content:center;gap:8px}
.btn:disabled{background:#B9ADA2}
.btn.sec{background:var(--card);color:var(--ink);border:1px solid var(--line2)}
.btn.danger{background:var(--card);color:var(--warn);border:1px solid #E3C4C0}
.btn.dashed{background:var(--accent-soft);color:var(--accent);border:1px dashed var(--taupe)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{min-height:40px;padding:0 14px 0 10px;border-radius:20px;border:1px solid var(--line2);background:var(--card);font-weight:600;font-size:13px;display:inline-flex;align-items:center;gap:7px}
.chip.sm{min-height:36px;border-radius:12px;font-weight:500;padding:0 12px 0 9px;gap:6px}
.seg{display:flex;gap:8px}
.seg button{flex:1;min-height:46px;border-radius:14px;border:1px solid var(--line2);background:var(--card);font-weight:600;display:flex;align-items:center;justify-content:center;gap:7px}
.seg button.on{background:var(--accent);color:#fff;border-color:var(--accent)}
.keypad{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.keypad button{height:52px;border-radius:14px;border:none;background:var(--card);font-size:21px;font-weight:600;box-shadow:0 1px 2px rgba(74,63,55,.08);display:flex;align-items:center;justify-content:center}
.keypad button:active{background:var(--accent-soft)}
.valor{font-family:'Space Grotesk',Inter,sans-serif;font-size:44px;font-weight:700;text-align:center}
.item{display:flex;align-items:center;gap:12px;padding:11px 0;border-bottom:1px solid var(--line);width:100%;background:none;border-left:0;border-right:0;border-top:0;text-align:left}
.item:last-child{border-bottom:none}
.badge{width:42px;height:42px;border-radius:14px;font-size:12px;font-weight:700;display:flex;align-items:center;justify-content:center;flex:0 0 auto}
.grow{flex:1;min-width:0}
.ellip{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dayhead{font-size:12px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;padding:16px 4px 6px}
.bar{height:8px;border-radius:4px;background:var(--line);overflow:hidden}
.bar>div{height:8px;border-radius:4px}
.field{display:flex;flex-direction:column;gap:7px}
.field label{font-size:13px;font-weight:600;color:var(--muted)}
.input{min-height:48px;border-radius:14px;border:1px solid var(--line2);background:var(--card);padding:0 12px;width:100%}
.input:focus{outline:2px solid var(--taupe);outline-offset:0;border-color:transparent}
nav.tabs{flex:0 0 auto;display:flex;background:var(--card);border-top:1px solid var(--line);padding:6px 6px calc(8px + var(--safe-b))}
nav.tabs button{flex:1;min-height:52px;border:none;background:none;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:11px;font-weight:600;color:#9A8E84}
nav.tabs button .ic{width:44px;height:30px;border-radius:15px;display:flex;align-items:center;justify-content:center}
nav.tabs button.on{color:var(--accent)}
nav.tabs button.on .ic{background:var(--accent-soft)}
nav.tabs button.plus .ic{background:var(--accent);color:#fff}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(88px + var(--safe-b));background:var(--ink);color:#fff;padding:10px 16px;border-radius:14px;font-size:14px;z-index:9;max-width:90%;text-align:center}
.tag{font-size:11px;font-weight:600;padding:3px 8px;border-radius:8px;display:inline-flex;align-items:center;gap:4px}
.arch{opacity:.45}
.center{min-height:100%;display:flex;flex-direction:column;justify-content:center;gap:16px;padding:24px;max-width:420px;margin:0 auto}
.err{color:var(--warn);font-size:13px}
a.link,button.link{color:var(--accent);background:none;border:none;font-weight:600;padding:8px 0;font-size:14px}
.ilus{display:block;width:100%;height:auto}
.capa{position:relative;height:160px;border-radius:24px;background-size:cover;background-position:center;overflow:hidden;box-shadow:0 8px 24px rgba(74,63,55,.18)}
.capa::after{content:'';position:absolute;inset:0;background:linear-gradient(180deg,rgba(46,39,34,0) 40%,rgba(46,39,34,.72))}
.capa .txt{position:absolute;left:16px;bottom:14px;right:16px;z-index:1;color:#fff;display:flex;align-items:center;justify-content:space-between;gap:8px}
.capa .txt b{font-size:18px;display:flex;align-items:center;gap:8px}
.fotobtn{position:relative;overflow:hidden;min-height:40px;font-size:14px;padding:0 14px}
.fotobtn input{position:absolute;inset:0;opacity:0;width:100%;height:100%;cursor:pointer}
img.avatar{object-fit:cover;display:block}
.desk-app{max-width:none}
.desk{display:flex;height:100%;width:100%}
.rail{flex:0 0 92px;background:var(--card);border-right:1px solid var(--line);display:flex;flex-direction:column;align-items:center;padding:22px 0 18px;gap:6px}
.rail .marca{width:48px;height:48px;border-radius:16px;background:var(--accent);color:#fff;display:flex;align-items:center;justify-content:center;margin-bottom:18px;box-shadow:0 6px 16px rgba(74,63,55,.25)}
.rail button{width:76px;min-height:64px;border:none;background:none;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font-size:11px;font-weight:600;color:#9A8E84;border-radius:16px}
.rail button .ic{width:48px;height:34px;border-radius:17px;display:flex;align-items:center;justify-content:center}
.rail button.on{color:var(--accent)}
.rail button.on .ic{background:var(--accent-soft)}
.rail button:hover .ic{background:var(--line)}
.rail .fim{margin-top:auto;display:flex;flex-direction:column;align-items:center;gap:10px}
.cols{flex:1;display:grid;min-width:0;height:100%}
.cols.c3{grid-template-columns:minmax(360px,1.15fr) minmax(360px,1fr) minmax(330px,1fr)}
.cols.c2{grid-template-columns:minmax(380px,1fr) minmax(380px,1fr)}
.col{overflow-y:auto;padding:26px 24px 32px;border-right:1px solid var(--line);min-width:0}
.col:last-child{border-right:none}
.col.meio{background:rgba(255,255,255,.28)}
.col-titulo{font-size:12px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;margin-bottom:12px;display:flex;align-items:center;gap:8px}
.dica{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:6px}
kbd{font-family:inherit;font-size:11px;background:var(--card);border:1px solid var(--line2);border-bottom-width:2px;border-radius:6px;padding:1px 6px}
.empty{text-align:center;padding:22px 16px 26px;display:flex;flex-direction:column;align-items:center;gap:10px}
</style>
</head>
<body>
<div id="app" class="app"></div>

<script>
/* =====================================================================
   CONFIGURAÇÃO — preencher com os dados do projeto Supabase
   (Supabase › Project Settings › API)
   ===================================================================== */
const SUPABASE_URL = 'https://O-TEU-PROJETO.supabase.co';
const SUPABASE_ANON_KEY = 'A-TUA-ANON-KEY';

const VERSAO = 'v1.4';
const mqDesk = window.matchMedia('(min-width: 1100px)');
function isDesk() { return mqDesk.matches; }
const BUCKET = 'fotos';
const CONFIG_EM_FALTA = /O-TEU-PROJETO|A-TUA-ANON-KEY/.test(SUPABASE_URL + SUPABASE_ANON_KEY) || /\/rest\/v1|supabase\.co\/$/.test(SUPABASE_URL);
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY, {
  auth: { persistSession: true, autoRefreshToken: true, detectSessionInUrl: true }
});

/* ---------- estado ---------- */
const hoje = () => { const d = new Date(); return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()); };
const S = {
  user: null, ligacoes: [], ag: null, perfil: null,
  membros: [], cats: [], subs: [], despesas: [], convites: [],
  mes: inicioMes(new Date()), tab: 'inicio', casaView: 'main', aberta: null,
  form: null, editId: null, fotos: {}, aCarregar: false, authMsg: '', authModo: 'entrar'
};
const IRS = { gerais: 'Despesas gerais familiares', saude: 'Saúde', educacao: 'Educação', habitacao: 'Habitação', nenhuma: 'Sem dedução' };
const PERFIS = { admin: 'Admin', membro: 'Membro', leitura: 'Leitura' };
const METODOS = { NUM: 'Numerário', CMB: 'Cartão multibanco', CR: 'Cartão refeição', TB: 'Transferência bancária', DD: 'Débito direto', EMP: 'Empresa' };
function ultimoMetodo() { try { const m = localStorage.getItem('dc_metodo'); return METODOS[m] ? m : ''; } catch (e) { return ''; } }
const PALETA = ['#7A8B6F', '#C0913A', '#B8734E', '#5F7A8A', '#8A6F8F', '#A65D5D', '#4F8A85', '#6E7F4A', '#8B6A4F', '#5E5048'];
const CORES_AVATAR = ['#5E5048', '#B8734E', '#7A8B6F', '#5F7A8A', '#8A6F8F'];

/* ---------- utilitários ---------- */
function pad(n) { return String(n).padStart(2, '0'); }
function inicioMes(d) { return new Date(d.getFullYear(), d.getMonth(), 1); }
function esc(s) {
  return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
}
const eurFmt = new Intl.NumberFormat('pt-PT', { style: 'currency', currency: 'EUR' });
function eur(v) { return eurFmt.format(Number(v) || 0); }
function dataCurta(iso) { const [y, m, d] = iso.split('-').map(Number); return new Date(y, m - 1, d).toLocaleDateString('pt-PT', { day: 'numeric', month: 'short' }).replace('.', ''); }
function dataLonga(iso) { const [y, m, d] = iso.split('-').map(Number); const dt = new Date(y, m - 1, d); return dt.toLocaleDateString('pt-PT', { weekday: 'long' }) + ', ' + dt.getDate() + ' ' + dt.toLocaleDateString('pt-PT', { month: 'short' }).replace('.', ''); }
function mesLabel(d) { const s = d.toLocaleDateString('pt-PT', { month: 'long', year: 'numeric' }); return s.charAt(0).toUpperCase() + s.slice(1); }
function corFundo(hex) { return hex + '1F'; }
function sigla(nome) { return (nome || '?').split(/\s+/).filter(Boolean).slice(0, 2).map(p => p[0]).join('').toUpperCase(); }
function nomeMembro(uid) { const m = S.membros.find(x => x.user_id === uid); return m ? m.nome : '—'; }
function catById(id) { return S.cats.find(c => c.id === id); }
function subById(id) { return S.subs.find(s => s.id === id); }
function podeEscrever() { return S.perfil === 'admin' || S.perfil === 'membro'; }
function isAdmin() { return S.perfil === 'admin'; }
function podeEditar(d) { return isAdmin() || (S.perfil === 'membro' && d.registado_por === S.user.id); }
let toastT;
function toast(msg) {
  document.querySelectorAll('.toast').forEach(t => t.remove());
  const t = document.createElement('div'); t.className = 'toast'; t.textContent = msg; document.body.appendChild(t);
  clearTimeout(toastT); toastT = setTimeout(() => t.remove(), 3000);
}
function erro(e) { console.error(e); toast((e && e.message) ? e.message : 'Ocorreu um erro'); }

const P = {
  home: '<path d="M3 10.5 12 3l9 7.5"/><path d="M5 9.5V21h14V9.5"/><path d="M10 21v-6h4v6"/>',
  plus: '<path d="M12 5v14M5 12h14"/>',
  chart: '<path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/>',
  users: '<circle cx="9" cy="8" r="3.5"/><path d="M2.5 20c.8-3.5 3.4-5.5 6.5-5.5s5.7 2 6.5 5.5"/><circle cx="17" cy="9" r="2.5"/><path d="M17 14.5c2.3 0 4 1.5 4.5 4"/>',
  esq: '<path d="M15 5l-7 7 7 7"/>', dir: '<path d="M9 5l7 7-7 7"/>',
  bolt: '<path d="M13 2 4 14h7l-1 8 9-12h-7l1-8z"/>',
  cart: '<circle cx="9" cy="20" r="1.5"/><circle cx="18" cy="20" r="1.5"/><path d="M2 3h3l2.5 12h11l2-8H6.2"/>',
  car: '<path d="M3 13l2-6h14l2 6v4H3z"/><circle cx="7" cy="17.5" r="2"/><circle cx="17" cy="17.5" r="2"/><path d="M3 13h18"/>',
  cap: '<path d="M2 9l10-5 10 5-10 5z"/><path d="M6 11v5c0 1.5 3 3 6 3s6-1.5 6-3v-5"/><path d="M22 9v6"/>',
  heart: '<path d="M12 20s-7-4.4-9-9a4.8 4.8 0 0 1 9-3 4.8 4.8 0 0 1 9 3c-2 4.6-9 9-9 9z"/>',
  sun: '<circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/>',
  bike: '<circle cx="5.5" cy="17" r="3.5"/><circle cx="18.5" cy="17" r="3.5"/><path d="M5.5 17 9 9h6l3.5 8"/><path d="M9 9l3 8 3-8"/><path d="M7.5 6h3"/>',
  waves: '<path d="M2 7c1.7 0 1.7-1.5 3.3-1.5S7 7 8.7 7s1.7-1.5 3.3-1.5S13.7 7 15.3 7s1.7-1.5 3.4-1.5S20.3 7 22 7"/><path d="M2 13c1.7 0 1.7-1.5 3.3-1.5S7 13 8.7 13s1.7-1.5 3.3-1.5 1.7 1.5 3.3 1.5 1.7-1.5 3.4-1.5S20.3 13 22 13"/><path d="M2 19c1.7 0 1.7-1.5 3.3-1.5S7 19 8.7 19s1.7-1.5 3.3-1.5 1.7 1.5 3.3 1.5 1.7-1.5 3.4-1.5S20.3 19 22 19"/>',
  leaf: '<path d="M12 22V11"/><path d="M12 11C12 6 8 3 3 3c0 5 4 8 9 8z"/><path d="M12 14c0-4 3-7 8-7 0 4-3 7-8 7z"/>',
  wrench: '<path d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.8-3.8a6 6 0 0 1-7.9 7.9l-6.9 6.9a2.1 2.1 0 0 1-3-3l6.9-6.9a6 6 0 0 1 7.9-7.9z"/>',
  sparkles: '<path d="M11 3l1.8 5.2L18 10l-5.2 1.8L11 17l-1.8-5.2L4 10l5.2-1.8z"/><path d="M19 14l.8 2.2L22 17l-2.2.8L19 20l-.8-2.2L16 17l2.2-.8z"/>',
  shield: '<path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>',
  wifi: '<path d="M2 9a15 15 0 0 1 20 0"/><path d="M5 12.5a10 10 0 0 1 14 0"/><path d="M8.5 16a5 5 0 0 1 7 0"/><circle cx="12" cy="19.5" r=".8"/>',
  sofa: '<path d="M4 11V8a2 2 0 0 1 2-2h12a2 2 0 0 1 2 2v3"/><path d="M2 13a2 2 0 0 1 4 0v2h12v-2a2 2 0 0 1 4 0v5H2z"/><path d="M5 18v2M19 18v2"/>',
  droplet: '<path d="M12 3s6 6.5 6 11a6 6 0 0 1-12 0c0-4.5 6-11 6-11z"/>',
  flame: '<path d="M12 22c4 0 7-2.7 7-7 0-4-3-6-4-9-1 2-2 3-3.5 3.5C11 7 11 4 9 2c0 4-4 6.5-4 12 0 4.3 3 8 7 8z"/>',

  receipt: '<path d="M5 3v18l2.5-1.5L10 21l2-1.5 2 1.5 2.5-1.5L19 21V3l-2.5 1.5L14 3l-2 1.5L10 3 7.5 4.5z"/><path d="M9 9h6M9 13h6"/>',
  road: '<path d="M6 21 9 3M18 21 15 3M12 5v2M12 11v2M12 17v2"/>',

  pencil: '<path d="M17 3l4 4L8 20H4v-4z"/>',

  pill: '<path d="M10.5 20.5a5 5 0 0 1-7-7l10-10a5 5 0 0 1 7 7z"/><path d="M8.5 8.5l7 7"/>',
  steth: '<path d="M5 3v6a5 5 0 0 0 10 0V3"/><path d="M10 14v2a5 5 0 0 0 10 0v-2"/><circle cx="20" cy="12" r="2"/>',
  pulse: '<path d="M22 12h-4l-3 9L9 3l-3 9H2"/>',
  glasses: '<circle cx="6" cy="15" r="4"/><circle cx="18" cy="15" r="4"/><path d="M10 15h4M2 15l2-8M22 15l-2-8"/>',

      ${m !== 'recuperar' ? '<button class="link" data-act="authModo" data-m="recuperar">Esqueci-me da palavra-passe</button>' : ''}
    </div>
  </div>`;
  document.getElementById('fAuth').addEventListener('submit', submeterAuth);
}

async function submeterAuth(ev) {
  ev.preventDefault();
  const email = document.getElementById('aEmail').value.trim();
  const passEl = document.getElementById('aPass');
  const pass = passEl ? passEl.value : '';
  const redirect = location.href.split('#')[0].split('?')[0];
  S.authMsg = '';
  try {
    if (S.authModo === 'entrar') {
      const { error } = await sb.auth.signInWithPassword({ email, password: pass });
      if (error) throw error;
    } else if (S.authModo === 'registar') {
      const { data, error } = await sb.auth.signUp({ email, password: pass, options: { emailRedirectTo: redirect } });
      if (error) throw error;
      if (!data.session) { S.authMsg = '✓ Conta criada. Confirma o email e depois entra.'; S.authModo = 'entrar'; renderAuth(); }
    } else {
      const { error } = await sb.auth.resetPasswordForEmail(email, { redirectTo: redirect });
      if (error) throw error;
      S.authMsg = '✓ Enviámos um email com o link para definires nova palavra-passe.'; S.authModo = 'entrar'; renderAuth();
    }
  } catch (e) {
    S.authMsg = traduzErroAuth(e.message); renderAuth();
  }
}
function traduzErroAuth(m) {
  if (/Failed to fetch|NetworkError|Load failed/i.test(m)) return 'Sem ligação ao Supabase. Confirma a internet e o SUPABASE_URL no topo do index.html.';
  if (/Invalid path/i.test(m)) return 'O SUPABASE_URL tem de terminar em .supabase.co (sem /rest/v1 nem barra no fim).';
  if (/Invalid login/i.test(m)) return 'Email ou palavra-passe incorretos.';
  if (/Email not confirmed/i.test(m)) return 'Ainda não confirmaste o email.';
  if (/already registered/i.test(m)) return 'Esse email já tem conta. Usa "Entrar".';
  if (/at least/i.test(m)) return 'A palavra-passe tem de ter pelo menos 8 caracteres.';
  return m;
}

let arrancado = false;
async function arrancar(session) {
  S.user = session.user;
  try { await sb.rpc('aceitar_convites'); } catch (e) { console.warn(e); }
  const { data, error } = await sb.from('membros')
    .select('agregado_id, perfil, nome, agregados(nome)')
    .eq('user_id', S.user.id);
  if (error) return erro(error);
  S.ligacoes = data || [];
  if (!S.ligacoes.length) return renderOnboarding();
  let guardado = null; try { guardado = localStorage.getItem('dc_agregado'); } catch (e) {}
  const lig = S.ligacoes.find(l => l.agregado_id === guardado) || S.ligacoes[0];
  await abrirAgregado(lig.agregado_id);
}

async function abrirAgregado(id) {
  const lig = S.ligacoes.find(l => l.agregado_id === id);
  S.ag = { id, nome: lig.agregados ? lig.agregados.nome : 'Casa' };
  S.perfil = lig.perfil;
  try { localStorage.setItem('dc_agregado', id); } catch (e) {}
  await Promise.all([carregarBase(), carregarMes()]);
  await carregarFotos();
  novoForm();
  render();
}

async function carregarBase() {
  const [m, c, s] = await Promise.all([
    sb.from('membros').select('user_id, perfil, nome, email, foto_em').eq('agregado_id', S.ag.id).order('criado_em'),
    sb.from('categorias').select('*').eq('agregado_id', S.ag.id).order('ordem').order('nome'),
    sb.from('subcategorias').select('*').eq('agregado_id', S.ag.id).order('ordem').order('nome')
  ]);
  if (m.error || c.error || s.error) return erro(m.error || c.error || s.error);
  S.membros = m.data; S.cats = c.data; S.subs = s.data;
  const ag = await sb.from('agregados').select('nome, foto_em').eq('id', S.ag.id).single();
  if (!ag.error && ag.data) { S.ag.nome = ag.data.nome; S.ag.foto_em = ag.data.foto_em; }
  const eu = S.membros.find(x => x.user_id === S.user.id);
  if (eu) S.perfil = eu.perfil;
  if (isAdmin()) await carregarConvites(); else S.convites = [];
}

async function carregarFotos() {
  const paths = [];
  if (S.ag.foto_em) paths.push(pathCasa());
  S.membros.forEach(m => { if (m.foto_em) paths.push(pathMembro(m.user_id)); });
  S.fotos = {};
  if (!paths.length) return;
  const { data, error } = await sb.storage.from(BUCKET).createSignedUrls(paths, 60 * 60 * 12);
  if (error) { console.warn(error); return; }
  (data || []).forEach(d => { if (d.signedUrl && d.path) S.fotos[d.path] = d.signedUrl; });
}

async function prepararImagem(file, tipo) {
  const url = URL.createObjectURL(file);
  try {
    const img = await new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = () => rej(new Error('Não consegui ler essa imagem')); i.src = url; });
    const w = img.naturalWidth, h = img.naturalHeight;
    let sx = 0, sy = 0, sw = w, sh = h, W, H;
    if (tipo === 'membro') { const s = Math.min(w, h); sx = (w - s) / 2; sy = (h - s) / 2; sw = sh = s; W = H = Math.min(480, s); }
    else { const k = Math.min(1, 1600 / Math.max(w, h)); W = Math.round(w * k); H = Math.round(h * k); }
    const cv = document.createElement('canvas'); cv.width = W; cv.height = H;
    cv.getContext('2d').drawImage(img, sx, sy, sw, sh, 0, 0, W, H);
    return await new Promise((res, rej) => cv.toBlob(b => b ? res(b) : rej(new Error('Falha ao preparar a imagem')), 'image/jpeg', 0.82));
  } finally { URL.revokeObjectURL(url); }
}

async function enviarFoto(tipo, file) {
  if (!file) return;
  toast('A enviar fotografia…');
  const blob = await prepararImagem(file, tipo);
  const path = tipo === 'casa' ? pathCasa() : pathMembro(S.user.id);
  const up = await sb.storage.from(BUCKET).upload(path, blob, { upsert: true, contentType: 'image/jpeg', cacheControl: '60' });
  if (up.error) return erro(up.error);
  const mk = await sb.rpc('marcar_foto', { p_agregado: S.ag.id, p_tipo: tipo, p_tem: true });
  if (mk.error) return erro(mk.error);
  await carregarBase(); await carregarFotos();
  toast('Fotografia atualizada'); render.manterScroll = true; render();
}

async function removerFoto(tipo) {
  if (!confirm(tipo === 'casa' ? 'Remover a fotografia da casa?' : 'Remover a tua fotografia?')) return;
  const path = tipo === 'casa' ? pathCasa() : pathMembro(S.user.id);
  const rm = await sb.storage.from(BUCKET).remove([path]);
  if (rm.error) return erro(rm.error);
  const mk = await sb.rpc('marcar_foto', { p_agregado: S.ag.id, p_tipo: tipo, p_tem: false });
  if (mk.error) return erro(mk.error);
  await carregarBase(); await carregarFotos(); render.manterScroll = true; render();
}

async function carregarConvites() {
  const { data, error } = await sb.from('convites').select('*').eq('agregado_id', S.ag.id).is('aceite_em', null).order('criado_em');
  if (!error) S.convites = data;
}

async function carregarMes() {
  const y = S.mes.getFullYear(), mo = S.mes.getMonth();
  const de = y + '-' + pad(mo + 1) + '-01';
  const fim = new Date(y, mo + 1, 1);
  const ate = fim.getFullYear() + '-' + pad(fim.getMonth() + 1) + '-01';
  const { data, error } = await sb.from('despesas').select('*')
    .eq('agregado_id', S.ag.id).gte('data', de).lt('data', ate)
    .order('data', { ascending: false }).order('criado_em', { ascending: false });
  if (error) return erro(error);
  S.despesas = data;
}

function catsAtivas() { return S.cats.filter(c => c.ativa); }
function subsDe(catId, incluirId) { return S.subs.filter(s => s.categoria_id === catId && (s.ativa || s.id === incluirId)); }

function novoForm() {
  const c = catsAtivas()[0];
  S.editId = null;
  S.form = { valor: '', cat: c ? c.id : null, sub: null, pago: S.user.id, data: hoje(), desc: '', metodo: ultimoMetodo(), fid: String(Math.random()) };
}
function formDe(d) {
  S.editId = d.id;
  S.form = { valor: String(d.valor).replace('.', ','), cat: d.categoria_id, sub: d.subcategoria_id, pago: d.pago_por, data: d.data, desc: d.descricao || '', metodo: d.metodo || '', fid: String(Math.random()) };
}
function valorNum() { return Math.round((parseFloat((S.form.valor || '0').replace(',', '.')) || 0) * 100) / 100; }

function tecla(k) {
  let v = S.form.valor;
  if (k === 'del') v = v.slice(0, -1);
  else if (k === ',') { if (!v.includes(',')) v = (v || '0') + ','; }
  else {
    const dec = v.split(',')[1];
    if (dec !== undefined && dec.length >= 2) return;
    if (v.replace(',', '').length >= 7) return;
    v = (v === '0') ? k : v + k;
  }
  S.form.valor = v;
  const el = document.getElementById('valorTxt'); if (el) el.textContent = (v || '0') + ' €';
  const b = document.getElementById('btnGuardar'); if (b) b.disabled = !(valorNum() > 0);
}

async function guardar() {
  lerCamposForm();
  const f = S.form, v = valorNum();
  if (!(v > 0)) return toast('Indica o valor');
  if (!f.cat) return toast('Escolhe uma categoria');
  const payload = { data: f.data || hoje(), valor: v, categoria_id: f.cat, subcategoria_id: f.sub || null, descricao: f.desc.trim() || null, pago_por: f.pago || null, metodo: f.metodo || null };
  if (f.metodo) { try { localStorage.setItem('dc_metodo', f.metodo); } catch (e) {} }
  const btn = document.getElementById('btnGuardar'); if (btn) btn.disabled = true;
  let res;
  if (S.editId) res = await sb.from('despesas').update(payload).eq('id', S.editId);
  else res = await sb.from('despesas').insert(Object.assign({ agregado_id: S.ag.id }, payload));
  if (res.error) { if (btn) btn.disabled = false; return erro(res.error); }
  toast(S.editId ? 'Despesa atualizada' : 'Despesa guardada');
  const [y, m] = payload.data.split('-').map(Number);
  S.mes = new Date(y, m - 1, 1);
  await carregarMes();
  novoForm(); S.tab = 'inicio'; render();
}

async function apagar() {
  if (!S.editId || !confirm('Apagar esta despesa?')) return;
  const { error } = await sb.from('despesas').delete().eq('id', S.editId);
  if (error) return erro(error);
  toast('Despesa apagada');
  await carregarMes(); novoForm(); S.tab = 'inicio'; render();
}

function lerCamposForm() {
  if (!S.form) return;
  const d = document.getElementById('fData'), t = document.getElementById('fDesc');
  if (d && d.dataset.fid === S.form.fid) S.form.data = d.value;
  if (t && t.dataset.fid === S.form.fid) S.form.desc = t.value;
}

  const reset = render.reset || [];

  if (S.tab === 'nova' && !podeEscrever()) S.tab = 'inicio';
  appEl.className = desk ? 'app desk-app' : 'app';

  if (desk) {
    const emCasa = S.tab === 'casa';
    const eu = S.membros.find(x => x.user_id === S.user.id) || {};
    const rail = `<nav class="rail" aria-label="Navegação">
      <div class="marca" aria-hidden="true">${ico('home', 24)}</div>
      <button data-act="tab" data-t="inicio" class="${emCasa ? '' : 'on'}"><span class="ic">${ico('chart', 22)}</span><span>Painel</span></button>
      <button data-act="tab" data-t="casa" class="${emCasa ? 'on' : ''}"><span class="ic">${ico('users', 22)}</span><span>Casa</span></button>

        <section class="col" data-scroll="inicio">${vInicio()}</section>
        <section class="col meio" data-scroll="nova">${podeEscrever() ? vNova() : `<div class="card empty">${ico('pencil', 28)}<b>Perfil de leitura</b><span class="muted">Podes consultar, mas não registar despesas.</span></div>`}</section>
        <section class="col" data-scroll="relatorio">${vRelatorio(true)}</section>

      corpo = `<div class="cols ${isAdmin() ? 'c2' : 'c2'}">
        <section class="col" data-scroll="casa">${vCasa(true)}</section>
        <section class="col meio" data-scroll="cats">${isAdmin() ? vCategorias(true) : `<div class="col-titulo">${ico('tag', 16)}Categorias</div><div class="stack">${S.cats.filter(c => c.ativa).map(c => `<div class="card row" style="gap:12px"><span class="badge" style="width:34px;height:34px;border-radius:11px;background:${corFundo(c.cor)};color:${c.cor}">${ico(iconeDe(c.nome), 18)}</span><b>${esc(c.nome)}</b></div>`).join('')}</div>`}</section>
      </div>`;
    }
    appEl.innerHTML = `<div class="desk">${rail}${corpo}</div>`;
  } else {
    const tabs = [['inicio', 'Início'], ['nova', S.editId ? 'Editar' : 'Nova'], ['relatorio', 'Relatório'], ['casa', 'Casa']]
      .filter(t => t[0] !== 'nova' || podeEscrever());
    const corpo = { inicio: vInicio, nova: vNova, relatorio: vRelatorio, casa: vCasa }[S.tab]();
    appEl.innerHTML = `
      <main class="content" id="content" data-scroll="m-${S.tab}">${corpo}</main>
      <nav class="tabs">${tabs.map(t => `<button data-act="tab" data-t="${t[0]}" class="${S.tab === t[0] ? 'on' : ''} ${t[0] === 'nova' && S.tab !== 'nova' ? 'plus' : ''}" aria-label="${t[1]}"><span class="ic">${ICON[t[0]]}</span><span>${t[1]}</span></button>`).join('')}</nav>`;
  }
  if (manter) appEl.querySelectorAll('[data-scroll]').forEach(e => { const k = e.dataset.scroll; if (k in scrolls && !reset.includes(k)) e.scrollTop = scrolls[k]; });
}
mqDesk.addEventListener('change', () => { if (S.ag && S.user) render(); });

function cabecalhoMes(titulo, semSetas) {
  if (semSetas) return `<div><div class="col-titulo">${ico('chart', 16)}${esc(titulo)}</div><div class="h1">${esc(mesLabel(S.mes))}</div></div>`;
  return `<div class="row between">
    <button class="iconbtn" data-act="mes" data-d="-1" aria-label="Mês anterior">${ICON.esq}</button>
    <div style="text-align:center"><div class="muted">${esc(titulo)}</div><div class="h1">${esc(mesLabel(S.mes))}</div></div>
    <button class="iconbtn" data-act="mes" data-d="1" aria-label="Mês seguinte">${ICON.dir}</button>
  </div>`;
}

function vInicio() {
  const total = S.despesas.reduce((a, d) => a + Number(d.valor), 0);
  const porMembro = S.membros.map(m => ({ uid: m.user_id, nome: m.nome, t: S.despesas.filter(d => d.pago_por === m.user_id).reduce((a, d) => a + Number(d.valor), 0) }))
    .filter(x => x.t > 0 || S.membros.length <= 3);
  let lista = '';
  if (!S.despesas.length) {
    lista = `<div class="card empty">${ILUS_CASA}<b>Sem despesas neste mês</b><span class="muted">Regista a primeira e ela aparece aqui.</span>${podeEscrever() ? `<button class="btn" data-act="tab" data-t="nova">${ico('plus', 18)} Registar despesa</button>` : ''}</div>`;
  } else {
    let dia = null, html = '';
    S.despesas.forEach(d => {
      if (d.data !== dia) { if (dia !== null) html += '</div>'; dia = d.data; html += `<div class="dayhead">${esc(dataLonga(d.data))}</div><div class="card" style="padding:2px 16px">`; }
      const c = catById(d.categoria_id) || { nome: '?', cor: '#8B7D72' };
      const s = d.subcategoria_id ? subById(d.subcategoria_id) : null;
      const titulo = d.descricao || (s ? s.nome : c.nome);
      const caminho = c.nome + (s ? ' › ' + s.nome : '');
      const tag = podeEditar(d) ? 'button' : 'div';
      html += `<${tag} class="item" ${tag === 'button' ? `data-act="editar" data-id="${d.id}" aria-label="Editar ${esc(titulo)}"` : ''}>
        <span class="badge" style="background:${corFundo(c.cor)};color:${c.cor}">${ico(iconeDe(s ? s.nome : c.nome), 21)}</span>
        <span class="grow"><span class="ellip" style="display:block;font-weight:600">${esc(titulo)}</span>
          <span class="muted small ellip" style="display:block">${esc(caminho)} · ${esc(nomeMembro(d.pago_por))}</span></span>
        <span style="display:flex;flex-direction:column;align-items:flex-end;gap:3px"><b>${eur(d.valor)}</b>${d.metodo ? `<span class="tag" style="background:var(--accent-soft);color:var(--accent)">${ico(ICON_METODO[d.metodo], 12)}${esc(d.metodo)}</span>` : ''}</span></${tag}>`;
    });
    lista = html + '</div>';
  }
  return `<div class="stack">
    ${fotoCasa()
      ? `<div class="capa" role="img" aria-label="Fotografia da casa" style="background-image:url('${esc(fotoCasa())}')"><div class="txt"><b>${ico('home', 18)}${esc(S.ag.nome)}</b><span class="tag" style="background:rgba(255,255,255,.22);color:#fff">${esc(PERFIS[S.perfil] || '')}</span></div></div>`
      : `<div class="row between"><div class="row" style="gap:8px;color:var(--accent)">${ico('home', 18)}<b>${esc(S.ag.nome)}</b></div><span class="tag" style="background:var(--accent-soft);color:var(--accent)">${esc(PERFIS[S.perfil] || '')}</span></div>`}
    ${cabecalhoMes('Despesas')}
    <div class="hero">${DECO_CASA}
      <span class="sub">Total do mês</span>
      <span class="big">${eur(total)}</span>
      <span class="sub">${S.despesas.length} ${S.despesas.length === 1 ? 'despesa registada' : 'despesas registadas'}</span>
      ${porMembro.length ? `<div class="row" style="gap:10px;padding-top:4px;flex-wrap:wrap">${porMembro.map(p => `<div class="pill">${avatar(p.uid, p.nome, 34)}<span><span class="sub">${esc(p.nome)}</span><b>${eur(p.t)}</b></span></div>`).join('')}</div>` : ''}
    </div>
    <div>${lista}</div>

}

  const teclas = ['1', '2', '3', '4', '5', '6', '7', '8', '9', ',', '0', 'del'];

      }).join('')}</div>
    </div>
    ${subs.length ? `<div class="field"><label>Subcategoria de ${esc(cat.nome)} <span style="font-weight:400">(opcional)</span></label>
      <div class="chips">${subs.map(s => {
        const on = s.id === f.sub;
        return `<button class="chip sm" data-act="sub" data-id="${s.id}" aria-pressed="${on}" style="${on ? `background:${corFundo(cat.cor)};border-color:${cat.cor};color:${cat.cor}` : ''}"><span style="color:${cat.cor};display:flex">${ico(iconeDe(s.nome), 15)}</span>${esc(s.nome)}</button>`;
      }).join('')}</div></div>` : ''}
    ${cat ? `<div class="muted small row" style="gap:6px">${ico('receipt', 14)} IRS: ${esc(IRS[cat.irs])}</div>` : ''}

    <div class="field"><label>Método de pagamento</label>
      <div class="seg" style="display:grid;grid-template-columns:repeat(3,minmax(0,1fr))">${Object.keys(METODOS).map(k => `<button data-act="metodo" data-k="${k}" class="${f.metodo === k ? 'on' : ''}" aria-pressed="${f.metodo === k}" title="${METODOS[k]}">${ico(ICON_METODO[k], 17)}${k}</button>`).join('')}</div>
      <div class="muted small">${f.metodo ? esc(METODOS[f.metodo]) : 'Opcional'}</div>
    </div>

    <div class="field"><label>Pago por</label>
      <div class="seg">${S.membros.filter(m => m.perfil !== 'leitura' || m.user_id === f.pago).map(m => `<button data-act="pago" data-id="${m.user_id}" class="${m.user_id === f.pago ? 'on' : ''}" aria-pressed="${m.user_id === f.pago}">${avatar(m.user_id, m.nome, 24)}${esc(m.nome)}</button>`).join('')}</div>
    </div>

    <div class="row" style="gap:10px;align-items:flex-end">
      <div class="field" style="flex:0 0 150px"><label for="fData">Data</label><input class="input" id="fData" data-fid="${esc(f.fid)}" type="date" value="${esc(f.data)}" max="2100-12-31"></div>
      <div class="field grow"><label for="fDesc">Descrição <span style="font-weight:400">(opcional)</span></label><input class="input" id="fDesc" data-fid="${esc(f.fid)}" maxlength="120" value="${esc(f.desc)}" placeholder="ex.: cloro, corte de relva"></div>
    </div>

    ${isDesk() ? `<div class="dica">${ico('keyboard', 15)} Valor pelo teclado <kbd>0–9</kbd><kbd>,</kbd><kbd>⌫</kbd> · <kbd>Enter</kbd> guarda</div>` : ''}
    <div class="keypad">${teclas.map(k => `<button data-act="tecla" data-k="${k}" aria-label="${k === 'del' ? 'Apagar' : (k === ',' ? 'Vírgula' : k)}">${k === 'del' ? ico('backspace', 22) : k}</button>`).join('')}</div>
    <button class="btn" id="btnGuardar" data-act="guardar" ${valorNum() > 0 ? '' : 'disabled'}>${ico('plus', 18)} ${S.editId ? 'Guardar alterações' : 'Guardar despesa'}</button>
    ${S.editId ? '<button class="btn danger" data-act="apagar">Apagar despesa</button>' : ''}
  </div>`;
}

function agregarPorCategoria() {
  const total = S.despesas.reduce((a, d) => a + Number(d.valor), 0);
  const mapa = {};
  S.despesas.forEach(d => {
    const k = d.categoria_id;
    if (!mapa[k]) mapa[k] = { t: 0, subs: {} };
    mapa[k].t += Number(d.valor);
    const sk = d.subcategoria_id || '_';
    mapa[k].subs[sk] = (mapa[k].subs[sk] || 0) + Number(d.valor);
  });
  const linhas = Object.keys(mapa).map(id => {
    const c = catById(id) || { nome: '?', cor: '#8B7D72', irs: 'nenhuma' };
    const subs = Object.keys(mapa[id].subs).map(sid => ({ nome: sid === '_' ? 'Sem subcategoria' : ((subById(sid) || {}).nome || '?'), t: mapa[id].subs[sid] })).sort((a, b) => b.t - a.t);
    return { id, nome: c.nome, cor: c.cor, irs: c.irs, t: mapa[id].t, subs };
  }).sort((a, b) => b.t - a.t);
  return { total, linhas };
}

function porMetodo() {
  const t = {};
  S.despesas.forEach(d => { const k = d.metodo || '_'; t[k] = (t[k] || 0) + Number(d.valor); });
  return Object.keys(t).map(k => ({ nome: k === '_' ? 'Sem método' : k + ' — ' + METODOS[k], icone: k === '_' ? 'tag' : ICON_METODO[k], t: t[k] })).sort((a, b) => b.t - a.t);
}

function vRelatorio(desk) {
  const { total, linhas } = agregarPorCategoria();
  const max = linhas.length ? linhas[0].t : 0;
  const irs = {};
  linhas.forEach(l => { if (l.irs !== 'nenhuma') irs[l.irs] = (irs[l.irs] || 0) + l.t; });
  return `<div class="stack">
    ${cabecalhoMes('Relatório', desk)}
    <div class="card stack" style="gap:12px">
      <div class="row between"><span class="sec-title">${ico('chart', 18)}Por categoria</span><b>${eur(total)}</b></div>
      ${linhas.length ? '<div class="muted small" style="margin-top:-6px">Toca numa categoria para ver as subcategorias</div>' : '<div class="muted">Sem despesas neste mês.</div>'}
      ${linhas.map(l => {
        const aberta = S.aberta === l.id;
        return `<div>
          <button data-act="toggleCat" data-id="${l.id}" aria-expanded="${aberta}" style="width:100%;border:none;background:none;padding:6px 0;text-align:left;display:flex;flex-direction:column;gap:6px">
            <span class="row between" style="width:100%;font-size:14px"><span class="row" style="gap:10px"><span class="badge" style="width:34px;height:34px;border-radius:11px;background:${corFundo(l.cor)};color:${l.cor}">${ico(iconeDe(l.nome), 18)}</span><b>${esc(l.nome)}</b><span class="muted">${aberta ? '▾' : '▸'}</span></span>
              <span class="muted"><b style="color:var(--ink)">${eur(l.t)}</b> · ${total ? Math.round(l.t / total * 100) : 0}%</span></span>
            <span class="bar" style="width:100%;display:block"><div style="width:${max ? Math.round(l.t / max * 100) : 0}%;background:${l.cor}"></div></span>
          </button>
          ${aberta ? `<div style="padding:6px 0 8px 44px;display:flex;flex-direction:column;gap:6px">${l.subs.map(s => `<div class="row between" style="font-size:13px;color:#4A3F37"><span class="row" style="gap:8px;color:${l.cor}">${ico(iconeDe(s.nome), 15)}<span style="color:#4A3F37">${esc(s.nome)}</span></span><b>${eur(s.t)}</b></div>`).join('')}</div>` : ''}
        </div>`;
      }).join('')}
    </div>
    ${S.despesas.length ? `<div class="card stack" style="gap:10px"><span class="sec-title">${ico('card', 18)}Por método de pagamento</span>
      ${porMetodo().map(m => `<div class="row between"><span class="row" style="gap:10px"><span class="badge" style="width:32px;height:32px;border-radius:10px;background:var(--accent-soft);color:var(--accent)">${ico(m.icone, 16)}</span>${esc(m.nome)}</span><b>${eur(m.t)}</b></div>`).join('')}</div>` : ''}
    ${Object.keys(irs).length ? `<div class="card stack" style="gap:8px"><span class="sec-title">${ico('receipt', 18)}Dedutível no IRS (estimativa)</span>
      ${Object.keys(irs).map(k => `<div class="row between"><span>${esc(IRS[k])}</span><b>${eur(irs[k])}</b></div>`).join('')}
      <div class="muted small">Indicativo: o enquadramento final no e-Fatura depende da atividade de cada fornecedor.</div></div>` : ''}
    <button class="btn sec" data-act="exportar" ${S.despesas.length ? '' : 'disabled'}>${ico('download', 18)} Exportar mês (CSV para Excel)</button>
  </div>`;
}

  return `<div class="stack">
    <div class="row between"><h1>Categorias</h1>${desk ? '' : '<button class="link" data-act="casaView" data-v="main">Fechar</button>'}</div>
    <div class="muted small">Arquivar esconde a categoria ou subcategoria no registo, mas mantém o histórico.</div>
    ${S.cats.map(c => `<div class="card stack ${c.ativa ? '' : 'arch'}" style="gap:8px">
      <div class="row between">
        <span class="row" style="gap:8px"><span class="badge" style="width:34px;height:34px;border-radius:11px;background:${corFundo(c.cor)};color:${c.cor}">${ico(iconeDe(c.nome), 18)}</span><b>${esc(c.nome)}</b></span>
        <span class="row" style="gap:4px">
          <button class="link" data-act="renomearCat" data-id="${c.id}">Renomear</button>
          <button class="link" data-act="arquivarCat" data-id="${c.id}">${c.ativa ? 'Arquivar' : 'Repor'}</button>
        </span>
      </div>
      <div class="row" style="gap:8px"><label class="muted small" for="irs-${c.id}">IRS</label>
        <select class="input" id="irs-${c.id}" style="min-height:38px" data-chg="irsCat" data-id="${c.id}">${Object.keys(IRS).map(k => `<option value="${k}" ${k === c.irs ? 'selected' : ''}>${IRS[k]}</option>`).join('')}</select></div>
      <div class="chips">${S.subs.filter(s => s.categoria_id === c.id).map(s => `<button class="chip sm ${s.ativa ? '' : 'arch'}" data-act="menuSub" data-id="${s.id}"><span style="color:${c.cor};display:flex">${ico(iconeDe(s.nome), 15)}</span>${esc(s.nome)}</button>`).join('')}
        <button class="chip sm" style="color:var(--accent);border-style:dashed" data-act="novaSub" data-id="${c.id}">+ Subcategoria</button></div>
    </div>`).join('')}
    <button class="btn dashed" data-act="novaCat">+ Nova categoria</button>
  </div>`;
}

/* =====================================================================
   AÇÕES
   ===================================================================== */
const A = {
  authModo: (el) => { S.authModo = el.dataset.m; S.authMsg = ''; renderAuth(); },
  sair: async () => { await sb.auth.signOut(); },
  tab: (el) => {
    lerCamposForm();
    S.tab = el.dataset.t; if (S.tab !== 'casa') S.casaView = 'main';
    render();
  },
  mes: async (el) => { S.mes = new Date(S.mes.getFullYear(), S.mes.getMonth() + Number(el.dataset.d), 1); S.aberta = null; await carregarMes(); render(); },
  editar: (el) => { const d = S.despesas.find(x => x.id === el.dataset.id); if (!d || !podeEditar(d)) return; formDe(d); S.tab = 'nova'; render.reset = ['nova']; render(); },
  cancelarEdicao: () => { novoForm(); S.tab = 'inicio'; render(); },
  cat: (el) => { lerCamposForm(); if (S.form.cat !== el.dataset.id) { S.form.cat = el.dataset.id; S.form.sub = null; } render.manterScroll = true; render(); },
  sub: (el) => { lerCamposForm(); S.form.sub = (S.form.sub === el.dataset.id) ? null : el.dataset.id; render.manterScroll = true; render(); },
  metodo: (el) => { lerCamposForm(); S.form.metodo = (S.form.metodo === el.dataset.k) ? '' : el.dataset.k; render.manterScroll = true; render(); },
  pago: (el) => { lerCamposForm(); S.form.pago = el.dataset.id; render.manterScroll = true; render(); },
  tecla: (el) => tecla(el.dataset.k),
  guardar: guardar,
  apagar: apagar,
  toggleCat: (el) => { S.aberta = S.aberta === el.dataset.id ? null : el.dataset.id; render.manterScroll = true; render(); },
  exportar: exportarCSV,
  removerFoto: (el) => removerFoto(el.dataset.tipo),
  casaView: (el) => { S.casaView = el.dataset.v; render(); },
  trocarAg: async (el) => { S.mes = inicioMes(new Date()); S.casaView = 'main'; S.tab = 'inicio'; await abrirAgregado(el.dataset.id); },
  renomearAg: async () => {
    const n = prompt('Nome da casa', S.ag.nome); if (!n || !n.trim()) return;
    const { error } = await sb.from('agregados').update({ nome: n.trim() }).eq('id', S.ag.id); if (error) return erro(error);
    S.ag.nome = n.trim(); const l = S.ligacoes.find(x => x.agregado_id === S.ag.id); if (l && l.agregados) l.agregados.nome = n.trim(); render();
  },
  removerMembro: async (el) => {
    const m = S.membros.find(x => x.user_id === el.dataset.id); if (!m || !confirm('Remover ' + m.nome + ' desta casa? As despesas que registou ficam.')) return;
    const { error } = await sb.from('membros').delete().eq('agregado_id', S.ag.id).eq('user_id', m.user_id); if (error) return erro(error);
    await carregarBase(); render();
  },
  apagarConvite: async (el) => {
    if (!confirm('Cancelar este convite?')) return;
    const { error } = await sb.from('convites').delete().eq('id', el.dataset.id); if (error) return erro(error);
    await carregarConvites(); render();
  },
  novaCat: async () => {
    const n = prompt('Nome da nova categoria'); if (!n || !n.trim()) return;
    const ordem = S.cats.reduce((a, c) => Math.max(a, c.ordem), 0) + 1;
    const cor = PALETA[S.cats.length % PALETA.length];
    const { error } = await sb.from('categorias').insert({ agregado_id: S.ag.id, nome: n.trim(), cor, ordem }); if (error) return erro(error);
    await carregarBase(); render.manterScroll = true; render();
  },
  renomearCat: async (el) => {
    const c = catById(el.dataset.id); const n = prompt('Nome da categoria', c.nome); if (!n || !n.trim()) return;
    const { error } = await sb.from('categorias').update({ nome: n.trim() }).eq('id', c.id); if (error) return erro(error);
    await carregarBase(); render.manterScroll = true; render();
  },
  arquivarCat: async (el) => {
    const c = catById(el.dataset.id);
    const { error } = await sb.from('categorias').update({ ativa: !c.ativa }).eq('id', c.id); if (error) return erro(error);
    await carregarBase(); if (!catById(S.form.cat) || !catById(S.form.cat).ativa) novoForm(); render.manterScroll = true; render();
  },
  novaSub: async (el) => {
    const c = catById(el.dataset.id); const n = prompt('Nova subcategoria de ' + c.nome); if (!n || !n.trim()) return;
    const ordem = S.subs.filter(s => s.categoria_id === c.id).reduce((a, s) => Math.max(a, s.ordem), 0) + 1;
    const { error } = await sb.from('subcategorias').insert({ agregado_id: S.ag.id, categoria_id: c.id, nome: n.trim(), ordem }); if (error) return erro(error);
    await carregarBase(); render.manterScroll = true; render();
  },
  menuSub: async (el) => {
    const s = subById(el.dataset.id);
    const n = prompt(`"${s.nome}": escreve um novo nome para renomear, ou deixa em branco e OK para ${s.ativa ? 'arquivar' : 'repor'}.`, s.nome);
    if (n === null) return;
    let res;
    if (n.trim() === '') res = await sb.from('subcategorias').update({ ativa: !s.ativa }).eq('id', s.id);
    else if (n.trim() !== s.nome) res = await sb.from('subcategorias').update({ nome: n.trim() }).eq('id', s.id);
    else return;
    if (res.error) return erro(res.error);
    await carregarBase(); render.manterScroll = true; render();
  }
};

const CHG = {
  perfilMembro: async (el) => {
    const { error } = await sb.from('membros').update({ perfil: el.value }).eq('agregado_id', S.ag.id).eq('user_id', el.dataset.id);
    if (error) { erro(error); } await carregarBase(); render.manterScroll = true; render();
  },
  irsCat: async (el) => {
    const { error } = await sb.from('categorias').update({ irs: el.value }).eq('id', el.dataset.id);
    if (error) erro(error); await carregarBase(); render.manterScroll = true; render();
  }
};

document.addEventListener('click', (ev) => {
  const el = ev.target.closest('[data-act]'); if (!el) return;
  const f = A[el.dataset.act]; if (!f) return;
  ev.preventDefault(); Promise.resolve(f(el)).catch(erro);
});
document.addEventListener('change', (ev) => {
  const up = ev.target.closest('[data-up]');
  if (up) { const f = up.files && up.files[0]; up.value = ''; Promise.resolve(enviarFoto(up.dataset.up, f)).catch(erro); return; }
  const el = ev.target.closest('[data-chg]'); if (!el) return;
  const f = CHG[el.dataset.chg]; if (f) Promise.resolve(f(el)).catch(erro);
});
document.addEventListener('submit', async (ev) => {
  if (ev.target.id !== 'fConv') return;
  ev.preventDefault();
  const nome = document.getElementById('cvNome').value.trim(), email = document.getElementById('cvEmail').value.trim().toLowerCase(), perfil = document.getElementById('cvPerfil').value;
  if (S.membros.some(m => (m.email || '').toLowerCase() === email)) return toast('Essa pessoa já é membro');
  const { error } = await sb.from('convites').insert({ agregado_id: S.ag.id, nome, email, perfil });
  if (error) return erro(/duplicate/i.test(error.message) ? { message: 'Já existe um convite para esse email' } : error);
  toast('Convite criado. Envia-lhe o link da app.'); await carregarConvites(); render.manterScroll = true; render();
});

/* ---------- exportação CSV (Excel PT: ponto e vírgula, vírgula decimal) ---------- */
function exportarCSV() {
  const q = (v) => '"' + String(v == null ? '' : v).replace(/"/g, '""') + '"';
  const linhas = [['Data', 'Valor', 'Categoria', 'Subcategoria', 'Descrição', 'Método', 'Pago por', 'Registado por', 'IRS'].map(q).join(';')];
  S.despesas.slice().reverse().forEach(d => {
    const c = catById(d.categoria_id) || {}, s = d.subcategoria_id ? subById(d.subcategoria_id) : null;
    linhas.push([d.data, String(Number(d.valor).toFixed(2)).replace('.', ','), c.nome, s ? s.nome : '', d.descricao || '', d.metodo ? d.metodo + ' - ' + METODOS[d.metodo] : '', nomeMembro(d.pago_por), nomeMembro(d.registado_por), IRS[c.irs] || ''].map(q).join(';'));
  });
  const blob = new Blob(['﻿' + linhas.join('\r\n')], { type: 'text/csv;charset=utf-8' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'despesas-' + S.mes.getFullYear() + '-' + pad(S.mes.getMonth() + 1) + '.csv';
  document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 500);
}

/* ---------- ciclo de vida ---------- */
sb.auth.onAuthStateChange(async (evento, session) => {
  if (evento === 'PASSWORD_RECOVERY') {
    const p = prompt('Nova palavra-passe (mínimo 8 caracteres)');
    if (p && p.length >= 8) { const { error } = await sb.auth.updateUser({ password: p }); toast(error ? error.message : 'Palavra-passe alterada'); }
  }
  if (evento === 'SIGNED_OUT' || !session) { arrancado = false; S.user = null; S.authModo = 'entrar'; renderAuth(); return; }
  if (!arrancado && (evento === 'INITIAL_SESSION' || evento === 'SIGNED_IN')) {
    arrancado = true;
    setTimeout(() => arrancar(session).catch(erro), 0);   // fora do callback para evitar bloqueio do supabase-js
  }
});

document.addEventListener('keydown', (ev) => {
  if (!S.ag || !S.form || !podeEscrever() || ev.metaKey || ev.ctrlKey || ev.altKey) return;
  const novaVisivel = S.tab === 'nova' || (isDesk() && S.tab !== 'casa');
  if (!novaVisivel) return;
  const t = ev.target, tag = t && t.tagName;
  if (tag === 'INPUT' || tag === 'SELECT' || tag === 'TEXTAREA') {
    if (ev.key === 'Enter' && t.id === 'fDesc') { ev.preventDefault(); if (valorNum() > 0) guardar().catch(erro); }
    return;
  }
  if (tag === 'BUTTON' && (ev.key === 'Enter' || ev.key === ' ')) return;
  if (/^[0-9]$/.test(ev.key)) tecla(ev.key);
  else if (ev.key === ',' || ev.key === '.') tecla(',');
  else if (ev.key === 'Backspace') tecla('del');
  else if (ev.key === 'Enter') { if (valorNum() > 0) guardar().catch(erro); }
  else return;
  ev.preventDefault();
});

document.addEventListener('visibilitychange', async () => {
  if (document.visibilityState === 'visible' && S.ag && S.tab !== 'nova') {
    try { await carregarMes(); render.manterScroll = true; render(); } catch (e) {}
  }
});

/* manifest gerado em tempo de execução (instalar no ecrã principal) */
(function () {
  const m = { name: 'Despesas da Casa', short_name: 'Despesas', start_url: location.href.split('#')[0].split('?')[0], display: 'standalone', background_color: '#F4F5F2', theme_color: '#F4F5F2' };
  const l = document.createElement('link'); l.rel = 'manifest';
  l.href = URL.createObjectURL(new Blob([JSON.stringify(m)], { type: 'application/manifest+json' }));
  document.head.appendChild(l);
})();
</script>
