<!DOCTYPE html>
<html lang="pt-PT">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Despesas">
<meta name="theme-color" content="#F4F5F2">
<title>Despesas da Casa</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{
  --bg:#F4F5F2; --card:#fff; --ink:#16211C; --muted:#56625C; --line:#ECEEEA; --line2:#D3D8D4;
  --accent:#1F6B4F; --accent-soft:#E3F0E9; --warn:#B23A48; --orange:#C2621B;
  --safe-b:env(safe-area-inset-bottom,0px); --safe-t:env(safe-area-inset-top,0px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:Inter,system-ui,-apple-system,sans-serif;font-size:15px}
button,input,select{font-family:inherit;font-size:inherit;color:inherit}
button{cursor:pointer}
h1,.h1{font-family:'Space Grotesk',Inter,sans-serif;font-size:24px;font-weight:700;margin:0}
.app{display:flex;flex-direction:column;height:100%;max-width:560px;margin:0 auto}
.content{flex:1 1 auto;overflow-y:auto;padding:calc(16px + var(--safe-t)) 18px 20px}
.stack{display:flex;flex-direction:column;gap:16px}
.row{display:flex;align-items:center;gap:10px}
.between{justify-content:space-between}
.muted{color:var(--muted);font-size:13px}
.small{font-size:12px}
.card{background:var(--card);border-radius:18px;padding:14px 16px}
.hero{background:var(--ink);color:#fff;border-radius:20px;padding:20px;display:flex;flex-direction:column;gap:10px}
.hero .big{font-family:'Space Grotesk',Inter,sans-serif;font-size:38px;font-weight:700}
.hero .sub{color:#B9C6BF;font-size:13px}
.pill{flex:1;background:#24312B;border-radius:12px;padding:10px 12px;display:flex;flex-direction:column;gap:2px}
.pill b{font-size:15px}
.iconbtn{width:44px;height:44px;border-radius:22px;border:none;background:var(--card);display:flex;align-items:center;justify-content:center}
.btn{min-height:48px;border-radius:14px;border:none;background:var(--accent);color:#fff;font-weight:600;font-size:16px;padding:0 18px}
.btn:disabled{background:#9AA8A1}
.btn.sec{background:var(--card);color:var(--ink);border:1px solid #C9D0CB}
.btn.danger{background:#fff;color:var(--warn);border:1px solid #EBC3C8}
.btn.dashed{background:#EAF3EE;color:var(--accent);border:1px dashed var(--accent)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{min-height:38px;padding:0 14px;border-radius:19px;border:1px solid var(--line2);background:#fff;font-weight:600;font-size:13px}
.chip.sm{min-height:34px;border-radius:10px;font-weight:500;padding:0 12px}
.seg{display:flex;gap:8px}
.seg button{flex:1;min-height:44px;border-radius:12px;border:1px solid var(--line2);background:#fff;font-weight:600}
.seg button.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.keypad{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.keypad button{height:50px;border-radius:12px;border:none;background:#fff;font-size:20px;font-weight:600}
.keypad button:active{background:var(--line)}
.valor{font-family:'Space Grotesk',Inter,sans-serif;font-size:42px;font-weight:700;text-align:center}
.item{display:flex;align-items:center;gap:12px;padding:11px 0;border-bottom:1px solid var(--line);width:100%;background:none;border-left:0;border-right:0;border-top:0;text-align:left}
.item:last-child{border-bottom:none}
.badge{width:38px;height:38px;border-radius:12px;font-size:12px;font-weight:700;display:flex;align-items:center;justify-content:center;flex:0 0 auto}
.grow{flex:1;min-width:0}
.ellip{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dayhead{font-size:12px;font-weight:600;color:var(--muted);text-transform:capitalize;padding:14px 0 2px}
.bar{height:8px;border-radius:4px;background:var(--line);overflow:hidden}
.bar>div{height:8px;border-radius:4px}
.field{display:flex;flex-direction:column;gap:6px}
.field label{font-size:13px;font-weight:600;color:var(--muted)}
.input{min-height:46px;border-radius:12px;border:1px solid var(--line2);background:#fff;padding:0 12px;width:100%}
.input:focus{outline:2px solid var(--accent);outline-offset:0;border-color:transparent}
nav.tabs{flex:0 0 auto;display:flex;background:#fff;border-top:1px solid #E3E6E1;padding:6px 6px calc(8px + var(--safe-b))}
nav.tabs button{flex:1;min-height:50px;border:none;background:none;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11px;font-weight:600;color:#7A857F}
nav.tabs button.on{color:var(--accent)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + var(--safe-b));background:var(--ink);color:#fff;padding:10px 16px;border-radius:12px;font-size:14px;z-index:9;max-width:90%;text-align:center}
.tag{font-size:11px;font-weight:600;padding:3px 8px;border-radius:8px}
.arch{opacity:.45}
.center{min-height:100%;display:flex;flex-direction:column;justify-content:center;gap:16px;padding:24px;max-width:420px;margin:0 auto}
.err{color:var(--warn);font-size:13px}
a.link,button.link{color:var(--accent);background:none;border:none;font-weight:600;padding:8px 0;font-size:14px}
</style>
</head>
<body>
<div id="app" class="app"></div>

<script>
/* =====================================================================
   CONFIGURAÇÃO — preencher com os dados do projeto Supabase
   (Supabase › Project Settings › API)
   ===================================================================== */
const SUPABASE_URL = 'https://rgnmyacsqaaglluzrrtq.supabase.co/rest/v1/';
const SUPABASE_ANON_KEY = 'sb_publishable_oI98aQTRVC7FY-hXFwqcuA_6O3HGSUK';

const VERSAO = 'v1.0';
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY, {
  auth: { persistSession: true, autoRefreshToken: true, detectSessionInUrl: true }
});

/* ---------- estado ---------- */
const hoje = () => { const d = new Date(); return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()); };
const S = {
  user: null, ligacoes: [], ag: null, perfil: null,
  membros: [], cats: [], subs: [], despesas: [], convites: [],
  mes: inicioMes(new Date()), tab: 'inicio', casaView: 'main', aberta: null,
  form: null, editId: null, aCarregar: false, authMsg: '', authModo: 'entrar'
};
const IRS = { gerais: 'Despesas gerais familiares', saude: 'Saúde', educacao: 'Educação', habitacao: 'Habitação', nenhuma: 'Sem dedução' };
const PERFIS = { admin: 'Admin', membro: 'Membro', leitura: 'Leitura' };
const PALETA = ['#1F6B4F', '#9A6B00', '#C2621B', '#2E5E9E', '#6B4BA8', '#B23A48', '#0E7C86', '#4F6B1F', '#7A4E2D', '#3F5561'];

/* ---------- utilitários ---------- */
function pad(n) { return String(n).padStart(2, '0'); }
function inicioMes(d) { return new Date(d.getFullYear(), d.getMonth(), 1); }
function esc(s) {
  return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
}
const eurFmt = new Intl.NumberFormat('pt-PT', { style: 'currency', currency: 'EUR' });
function eur(v) { return eurFmt.format(Number(v) || 0); }
function dataCurta(iso) { const [y, m, d] = iso.split('-').map(Number); return new Date(y, m - 1, d).toLocaleDateString('pt-PT', { day: 'numeric', month: 'short' }).replace('.', ''); }
function dataLonga(iso) { const [y, m, d] = iso.split('-').map(Number); const dt = new Date(y, m - 1, d); return dt.toLocaleDateString('pt-PT', { weekday: 'long' }) + ', ' + dt.getDate() + ' ' + dt.toLocaleDateString('pt-PT', { month: 'short' }).replace('.', ''); }
function mesLabel(d) { const s = d.toLocaleDateString('pt-PT', { month: 'long', year: 'numeric' }); return s.charAt(0).toUpperCase() + s.slice(1); }
function corFundo(hex) { return hex + '1F'; }
function sigla(nome) { return (nome || '?').split(/\s+/).filter(Boolean).slice(0, 2).map(p => p[0]).join('').toUpperCase(); }
function nomeMembro(uid) { const m = S.membros.find(x => x.user_id === uid); return m ? m.nome : '—'; }
function catById(id) { return S.cats.find(c => c.id === id); }
function subById(id) { return S.subs.find(s => s.id === id); }
function podeEscrever() { return S.perfil === 'admin' || S.perfil === 'membro'; }
function isAdmin() { return S.perfil === 'admin'; }
function podeEditar(d) { return isAdmin() || (S.perfil === 'membro' && d.registado_por === S.user.id); }
let toastT;
function toast(msg) {
  document.querySelectorAll('.toast').forEach(t => t.remove());
  const t = document.createElement('div'); t.className = 'toast'; t.textContent = msg; document.body.appendChild(t);
  clearTimeout(toastT); toastT = setTimeout(() => t.remove(), 3000);
}
function erro(e) { console.error(e); toast((e && e.message) ? e.message : 'Ocorreu um erro'); }

const ICON = {
  inicio: '<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 10.5 12 3l9 7.5"/><path d="M5 9.5V21h14V9.5"/></svg>',
  nova: '<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 8v8M8 12h8"/></svg>',
  relatorio: '<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg>',
  casa: '<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="9" cy="8" r="3.5"/><path d="M2.5 20c.8-3.5 3.4-5.5 6.5-5.5s5.7 2 6.5 5.5"/><circle cx="17" cy="9" r="2.5"/><path d="M17 14.5c2.3 0 4 1.5 4.5 4"/></svg>',
  esq: '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg>',
  dir: '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M9 5l7 7-7 7"/></svg>'
};

/* =====================================================================
   AUTENTICAÇÃO
   ===================================================================== */
function renderAuth() {
  const m = S.authModo;
  const titulo = m === 'registar' ? 'Criar conta' : (m === 'recuperar' ? 'Recuperar palavra-passe' : 'Entrar');
  document.getElementById('app').innerHTML = `
  <div class="center">
    <div><div class="muted">Despesas da Casa</div><h1>${titulo}</h1></div>
    <form id="fAuth" class="stack" autocomplete="on">
      ${m === 'registar' ? '<div class="muted">Se recebeste um convite, usa o mesmo email do convite.</div>' : ''}
      <div class="field"><label for="aEmail">Email</label>
        <input class="input" id="aEmail" type="email" autocomplete="email" required></div>
      ${m !== 'recuperar' ? `<div class="field"><label for="aPass">Palavra-passe</label>
        <input class="input" id="aPass" type="password" minlength="8" autocomplete="${m === 'registar' ? 'new-password' : 'current-password'}" required></div>` : ''}
      ${S.authMsg ? `<div class="${S.authMsg.startsWith('✓') ? 'muted' : 'err'}">${esc(S.authMsg)}</div>` : ''}
      <button class="btn" type="submit">${titulo}</button>
    </form>
    <div class="row between">
      ${m !== 'entrar' ? '<button class="link" data-act="authModo" data-m="entrar">Já tenho conta</button>' : '<button class="link" data-act="authModo" data-m="registar">Criar conta</button>'}
      ${m !== 'recuperar' ? '<button class="link" data-act="authModo" data-m="recuperar">Esqueci-me da palavra-passe</button>' : ''}
    </div>
  </div>`;
  document.getElementById('fAuth').addEventListener('submit', submeterAuth);
}

async function submeterAuth(ev) {
  ev.preventDefault();
  const email = document.getElementById('aEmail').value.trim();
  const passEl = document.getElementById('aPass');
  const pass = passEl ? passEl.value : '';
  const redirect = location.href.split('#')[0].split('?')[0];
  S.authMsg = '';
  try {
    if (S.authModo === 'entrar') {
      const { error } = await sb.auth.signInWithPassword({ email, password: pass });
      if (error) throw error;
    } else if (S.authModo === 'registar') {
      const { data, error } = await sb.auth.signUp({ email, password: pass, options: { emailRedirectTo: redirect } });
      if (error) throw error;
      if (!data.session) { S.authMsg = '✓ Conta criada. Confirma o email e depois entra.'; S.authModo = 'entrar'; renderAuth(); }
    } else {
      const { error } = await sb.auth.resetPasswordForEmail(email, { redirectTo: redirect });
      if (error) throw error;
      S.authMsg = '✓ Enviámos um email com o link para definires nova palavra-passe.'; S.authModo = 'entrar'; renderAuth();
    }
  } catch (e) {
    S.authMsg = traduzErroAuth(e.message); renderAuth();
  }
}
function traduzErroAuth(m) {
  if (/Invalid login/i.test(m)) return 'Email ou palavra-passe incorretos.';
  if (/Email not confirmed/i.test(m)) return 'Ainda não confirmaste o email.';
  if (/already registered/i.test(m)) return 'Esse email já tem conta. Usa "Entrar".';
  if (/at least/i.test(m)) return 'A palavra-passe tem de ter pelo menos 8 caracteres.';
  return m;
}

/* =====================================================================
   ARRANQUE E CARREGAMENTO
   ===================================================================== */
let arrancado = false;
async function arrancar(session) {
  S.user = session.user;
  try { await sb.rpc('aceitar_convites'); } catch (e) { console.warn(e); }
  const { data, error } = await sb.from('membros')
    .select('agregado_id, perfil, nome, agregados(nome)')
    .eq('user_id', S.user.id);
  if (error) return erro(error);
  S.ligacoes = data || [];
  if (!S.ligacoes.length) return renderOnboarding();
  let guardado = null; try { guardado = localStorage.getItem('dc_agregado'); } catch (e) {}
  const lig = S.ligacoes.find(l => l.agregado_id === guardado) || S.ligacoes[0];
  await abrirAgregado(lig.agregado_id);
}

async function abrirAgregado(id) {
  const lig = S.ligacoes.find(l => l.agregado_id === id);
  S.ag = { id, nome: lig.agregados ? lig.agregados.nome : 'Casa' };
  S.perfil = lig.perfil;
  try { localStorage.setItem('dc_agregado', id); } catch (e) {}
  await Promise.all([carregarBase(), carregarMes()]);
  novoForm();
  render();
}

async function carregarBase() {
  const [m, c, s] = await Promise.all([
    sb.from('membros').select('user_id, perfil, nome, email').eq('agregado_id', S.ag.id).order('criado_em'),
    sb.from('categorias').select('*').eq('agregado_id', S.ag.id).order('ordem').order('nome'),
    sb.from('subcategorias').select('*').eq('agregado_id', S.ag.id).order('ordem').order('nome')
  ]);
  if (m.error || c.error || s.error) return erro(m.error || c.error || s.error);
  S.membros = m.data; S.cats = c.data; S.subs = s.data;
  const eu = S.membros.find(x => x.user_id === S.user.id);
  if (eu) S.perfil = eu.perfil;
  if (isAdmin()) await carregarConvites(); else S.convites = [];
}

async function carregarConvites() {
  const { data, error } = await sb.from('convites').select('*').eq('agregado_id', S.ag.id).is('aceite_em', null).order('criado_em');
  if (!error) S.convites = data;
}

async function carregarMes() {
  const y = S.mes.getFullYear(), mo = S.mes.getMonth();
  const de = y + '-' + pad(mo + 1) + '-01';
  const fim = new Date(y, mo + 1, 1);
  const ate = fim.getFullYear() + '-' + pad(fim.getMonth() + 1) + '-01';
  const { data, error } = await sb.from('despesas').select('*')
    .eq('agregado_id', S.ag.id).gte('data', de).lt('data', ate)
    .order('data', { ascending: false }).order('criado_em', { ascending: false });
  if (error) return erro(error);
  S.despesas = data;
}

/* ---------- onboarding: criar a primeira casa ---------- */
function renderOnboarding() {
  document.getElementById('app').innerHTML = `
  <div class="center">
    <div><div class="muted">Bem-vindo</div><h1>Criar a tua casa</h1></div>
    <div class="muted">Se alguém te convidou, pede-lhe para confirmar que usou este email: ${esc(S.user.email)}. Depois sai e volta a entrar.</div>
    <form id="fOnb" class="stack">
      <div class="field"><label for="oCasa">Nome da casa</label><input class="input" id="oCasa" maxlength="80" placeholder="Casa Silva" required></div>
      <div class="field"><label for="oNome">O teu nome</label><input class="input" id="oNome" maxlength="60" required></div>
      <button class="btn" type="submit">Criar</button>
    </form>
    <button class="link" data-act="sair">Sair</button>
  </div>`;
  document.getElementById('fOnb').addEventListener('submit', async (ev) => {
    ev.preventDefault();
    const { error } = await sb.rpc('criar_agregado', { p_nome: document.getElementById('oCasa').value, p_meu_nome: document.getElementById('oNome').value });
    if (error) return erro(error);
    const { data } = await sb.auth.getSession();
    arrancar(data.session);
  });
}

/* =====================================================================
   FORMULÁRIO DE DESPESA
   ===================================================================== */
function catsAtivas() { return S.cats.filter(c => c.ativa); }
function subsDe(catId, incluirId) { return S.subs.filter(s => s.categoria_id === catId && (s.ativa || s.id === incluirId)); }

function novoForm() {
  const c = catsAtivas()[0];
  S.editId = null;
  S.form = { valor: '', cat: c ? c.id : null, sub: null, pago: S.user.id, data: hoje(), desc: '' };
}
function formDe(d) {
  S.editId = d.id;
  S.form = { valor: String(d.valor).replace('.', ','), cat: d.categoria_id, sub: d.subcategoria_id, pago: d.pago_por, data: d.data, desc: d.descricao || '' };
}
function valorNum() { return Math.round((parseFloat((S.form.valor || '0').replace(',', '.')) || 0) * 100) / 100; }

function tecla(k) {
  let v = S.form.valor;
  if (k === 'del') v = v.slice(0, -1);
  else if (k === ',') { if (!v.includes(',')) v = (v || '0') + ','; }
  else {
    const dec = v.split(',')[1];
    if (dec !== undefined && dec.length >= 2) return;
    if (v.replace(',', '').length >= 7) return;
    v = (v === '0') ? k : v + k;
  }
  S.form.valor = v;
  const el = document.getElementById('valorTxt'); if (el) el.textContent = (v || '0') + ' €';
  const b = document.getElementById('btnGuardar'); if (b) b.disabled = !(valorNum() > 0);
}

async function guardar() {
  lerCamposForm();
  const f = S.form, v = valorNum();
  if (!(v > 0)) return toast('Indica o valor');
  if (!f.cat) return toast('Escolhe uma categoria');
  const payload = { data: f.data || hoje(), valor: v, categoria_id: f.cat, subcategoria_id: f.sub || null, descricao: f.desc.trim() || null, pago_por: f.pago || null };
  const btn = document.getElementById('btnGuardar'); if (btn) btn.disabled = true;
  let res;
  if (S.editId) res = await sb.from('despesas').update(payload).eq('id', S.editId);
  else res = await sb.from('despesas').insert(Object.assign({ agregado_id: S.ag.id }, payload));
  if (res.error) { if (btn) btn.disabled = false; return erro(res.error); }
  toast(S.editId ? 'Despesa atualizada' : 'Despesa guardada');
  const [y, m] = payload.data.split('-').map(Number);
  S.mes = new Date(y, m - 1, 1);
  await carregarMes();
  novoForm(); S.tab = 'inicio'; render();
}

async function apagar() {
  if (!S.editId || !confirm('Apagar esta despesa?')) return;
  const { error } = await sb.from('despesas').delete().eq('id', S.editId);
  if (error) return erro(error);
  toast('Despesa apagada');
  await carregarMes(); novoForm(); S.tab = 'inicio'; render();
}

function lerCamposForm() {
  const d = document.getElementById('fData'), t = document.getElementById('fDesc');
  if (d) S.form.data = d.value; if (t) S.form.desc = t.value;
}

/* =====================================================================
   RENDER
   ===================================================================== */
function render() {
  const tabs = [['inicio', 'Início'], ['nova', S.editId ? 'Editar' : 'Nova'], ['relatorio', 'Relatório'], ['casa', 'Casa']]
    .filter(t => t[0] !== 'nova' || podeEscrever());
  if (S.tab === 'nova' && !podeEscrever()) S.tab = 'inicio';
  const corpo = { inicio: vInicio, nova: vNova, relatorio: vRelatorio, casa: vCasa }[S.tab]();
  const scrollTop = (document.querySelector('.content') || {}).scrollTop || 0;
  document.getElementById('app').innerHTML = `
    <main class="content" id="content">${corpo}</main>
    <nav class="tabs">${tabs.map(t => `<button data-act="tab" data-t="${t[0]}" class="${S.tab === t[0] ? 'on' : ''}" aria-label="${t[1]}">${ICON[t[0]]}<span>${t[1]}</span></button>`).join('')}</nav>`;
  if (render.manterScroll) { document.getElementById('content').scrollTop = scrollTop; render.manterScroll = false; }
}

function cabecalhoMes(titulo) {
  return `<div class="row between">
    <button class="iconbtn" data-act="mes" data-d="-1" aria-label="Mês anterior">${ICON.esq}</button>
    <div style="text-align:center"><div class="muted">${esc(titulo)}</div><div class="h1">${esc(mesLabel(S.mes))}</div></div>
    <button class="iconbtn" data-act="mes" data-d="1" aria-label="Mês seguinte">${ICON.dir}</button>
  </div>`;
}

function vInicio() {
  const total = S.despesas.reduce((a, d) => a + Number(d.valor), 0);
  const porMembro = S.membros.map(m => ({ nome: m.nome, t: S.despesas.filter(d => d.pago_por === m.user_id).reduce((a, d) => a + Number(d.valor), 0) }))
    .filter(x => x.t > 0 || S.membros.length <= 3);
  let lista = '';
  if (!S.despesas.length) {
    lista = `<div class="card muted" style="text-align:center;padding:28px 16px">Sem despesas neste mês.${podeEscrever() ? '<br><br><button class="btn" data-act="tab" data-t="nova">Registar despesa</button>' : ''}</div>`;
  } else {
    let dia = null, html = '';
    S.despesas.forEach(d => {
      if (d.data !== dia) { if (dia !== null) html += '</div>'; dia = d.data; html += `<div class="dayhead">${esc(dataLonga(d.data))}</div><div class="card" style="padding:2px 16px">`; }
      const c = catById(d.categoria_id) || { nome: '?', cor: '#7A857F' };
      const s = d.subcategoria_id ? subById(d.subcategoria_id) : null;
      const titulo = d.descricao || (s ? s.nome : c.nome);
      const caminho = c.nome + (s ? ' › ' + s.nome : '');
      const tag = podeEditar(d) ? 'button' : 'div';
      html += `<${tag} class="item" ${tag === 'button' ? `data-act="editar" data-id="${d.id}" aria-label="Editar ${esc(titulo)}"` : ''}>
        <span class="badge" style="background:${corFundo(c.cor)};color:${c.cor}">${esc(sigla(c.nome))}</span>
        <span class="grow"><span class="ellip" style="display:block;font-weight:500">${esc(titulo)}</span>
          <span class="muted small ellip" style="display:block">${esc(caminho)} · ${esc(nomeMembro(d.pago_por))}</span></span>
        <b>${eur(d.valor)}</b></${tag}>`;
    });
    lista = html + '</div>';
  }
  return `<div class="stack">
    <div class="row between"><div><div class="muted">${esc(S.ag.nome)}</div></div><div class="muted small">${esc(PERFIS[S.perfil] || '')}</div></div>
    ${cabecalhoMes('Despesas')}
    <div class="hero">
      <span class="sub">Total do mês</span>
      <span class="big">${eur(total)}</span>
      <span class="sub">${S.despesas.length} ${S.despesas.length === 1 ? 'despesa registada' : 'despesas registadas'}</span>
      ${porMembro.length ? `<div class="row" style="gap:10px;padding-top:4px;flex-wrap:wrap">${porMembro.map(p => `<div class="pill"><span class="sub">${esc(p.nome)}</span><b>${eur(p.t)}</b></div>`).join('')}</div>` : ''}
    </div>
    <div>${lista}</div>
  </div>`;
}

function vNova() {
  const f = S.form;
  if (!catsAtivas().length) return `<div class="stack"><h1>Nova despesa</h1><div class="card muted">Ainda não há categorias ativas. ${isAdmin() ? 'Cria-as em Casa › Categorias.' : 'Pede ao admin para as criar.'}</div></div>`;
  const cat = catById(f.cat);
  const subs = cat ? subsDe(cat.id, f.sub) : [];
  const teclas = ['1', '2', '3', '4', '5', '6', '7', '8', '9', ',', '0', 'del'];
  return `<div class="stack">
    <div class="row between"><h1>${S.editId ? 'Editar despesa' : 'Nova despesa'}</h1>
      ${S.editId ? '<button class="link" data-act="cancelarEdicao">Cancelar</button>' : ''}</div>
    <div class="card" style="text-align:center"><div class="muted">Valor</div><div class="valor" id="valorTxt">${esc((f.valor || '0') + ' €')}</div></div>

    <div class="field"><label>Categoria</label>
      <div class="chips">${catsAtivas().concat(cat && !cat.ativa ? [cat] : []).map(c => {
        const on = c.id === f.cat;
        return `<button class="chip" data-act="cat" data-id="${c.id}" aria-pressed="${on}" style="${on ? `background:${c.cor};border-color:${c.cor};color:#fff` : ''}">${esc(c.nome)}</button>`;
      }).join('')}</div>
    </div>
    ${subs.length ? `<div class="field"><label>Subcategoria de ${esc(cat.nome)} <span style="font-weight:400">(opcional)</span></label>
      <div class="chips">${subs.map(s => {
        const on = s.id === f.sub;
        return `<button class="chip sm" data-act="sub" data-id="${s.id}" aria-pressed="${on}" style="${on ? `background:${corFundo(cat.cor)};border-color:${cat.cor};color:${cat.cor}` : ''}">${esc(s.nome)}</button>`;
      }).join('')}</div></div>` : ''}
    ${cat ? `<div class="muted small">IRS: ${esc(IRS[cat.irs])}</div>` : ''}

    <div class="field"><label>Pago por</label>
      <div class="seg">${S.membros.filter(m => m.perfil !== 'leitura' || m.user_id === f.pago).map(m => `<button data-act="pago" data-id="${m.user_id}" class="${m.user_id === f.pago ? 'on' : ''}" aria-pressed="${m.user_id === f.pago}">${esc(m.nome)}</button>`).join('')}</div>
    </div>

    <div class="row" style="gap:10px;align-items:flex-end">
      <div class="field" style="flex:0 0 150px"><label for="fData">Data</label><input class="input" id="fData" type="date" value="${esc(f.data)}" max="2100-12-31"></div>
      <div class="field grow"><label for="fDesc">Descrição <span style="font-weight:400">(opcional)</span></label><input class="input" id="fDesc" maxlength="120" value="${esc(f.desc)}" placeholder="ex.: cloro, corte de relva"></div>
    </div>

    <div class="keypad">${teclas.map(k => `<button data-act="tecla" data-k="${k}" aria-label="${k === 'del' ? 'Apagar' : (k === ',' ? 'Vírgula' : k)}">${k === 'del' ? '⌫' : k}</button>`).join('')}</div>
    <button class="btn" id="btnGuardar" data-act="guardar" ${valorNum() > 0 ? '' : 'disabled'}>${S.editId ? 'Guardar alterações' : 'Guardar despesa'}</button>
    ${S.editId ? '<button class="btn danger" data-act="apagar">Apagar despesa</button>' : ''}
  </div>`;
}

function agregarPorCategoria() {
  const total = S.despesas.reduce((a, d) => a + Number(d.valor), 0);
  const mapa = {};
  S.despesas.forEach(d => {
    const k = d.categoria_id;
    if (!mapa[k]) mapa[k] = { t: 0, subs: {} };
    mapa[k].t += Number(d.valor);
    const sk = d.subcategoria_id || '_';
    mapa[k].subs[sk] = (mapa[k].subs[sk] || 0) + Number(d.valor);
  });
  const linhas = Object.keys(mapa).map(id => {
    const c = catById(id) || { nome: '?', cor: '#7A857F', irs: 'nenhuma' };
    const subs = Object.keys(mapa[id].subs).map(sid => ({ nome: sid === '_' ? 'Sem subcategoria' : ((subById(sid) || {}).nome || '?'), t: mapa[id].subs[sid] })).sort((a, b) => b.t - a.t);
    return { id, nome: c.nome, cor: c.cor, irs: c.irs, t: mapa[id].t, subs };
  }).sort((a, b) => b.t - a.t);
  return { total, linhas };
}

function vRelatorio() {
  const { total, linhas } = agregarPorCategoria();
  const max = linhas.length ? linhas[0].t : 0;
  const irs = {};
  linhas.forEach(l => { if (l.irs !== 'nenhuma') irs[l.irs] = (irs[l.irs] || 0) + l.t; });
  return `<div class="stack">
    ${cabecalhoMes('Relatório')}
    <div class="card stack" style="gap:12px">
      <div class="row between"><b>Por categoria</b><b>${eur(total)}</b></div>
      ${linhas.length ? '<div class="muted small" style="margin-top:-6px">Toca numa categoria para ver as subcategorias</div>' : '<div class="muted">Sem despesas neste mês.</div>'}
      ${linhas.map(l => {
        const aberta = S.aberta === l.id;
        return `<div>
          <button data-act="toggleCat" data-id="${l.id}" aria-expanded="${aberta}" style="width:100%;border:none;background:none;padding:6px 0;text-align:left;display:flex;flex-direction:column;gap:6px">
            <span class="row between" style="width:100%;font-size:13px"><b>${aberta ? '▾' : '▸'} ${esc(l.nome)}</b>
              <span class="muted"><b style="color:var(--ink)">${eur(l.t)}</b> · ${total ? Math.round(l.t / total * 100) : 0}%</span></span>
            <span class="bar" style="width:100%;display:block"><div style="width:${max ? Math.round(l.t / max * 100) : 0}%;background:${l.cor}"></div></span>
          </button>
          ${aberta ? `<div style="padding:4px 0 6px 18px;display:flex;flex-direction:column;gap:6px">${l.subs.map(s => `<div class="row between" style="font-size:13px;color:#3C4842"><span>${esc(s.nome)}</span><b>${eur(s.t)}</b></div>`).join('')}</div>` : ''}
        </div>`;
      }).join('')}
    </div>
    ${Object.keys(irs).length ? `<div class="card stack" style="gap:8px"><b>Dedutível no IRS (estimativa)</b>
      ${Object.keys(irs).map(k => `<div class="row between"><span>${esc(IRS[k])}</span><b>${eur(irs[k])}</b></div>`).join('')}
      <div class="muted small">Indicativo: o enquadramento final no e-Fatura depende da atividade de cada fornecedor.</div></div>` : ''}
    <button class="btn sec" data-act="exportar" ${S.despesas.length ? '' : 'disabled'}>Exportar mês (CSV para Excel)</button>
  </div>`;
}

function vCasa() {
  if (S.casaView === 'cats') return vCategorias();
  const outras = S.ligacoes.filter(l => l.agregado_id !== S.ag.id);
  return `<div class="stack">
    <div class="row between"><div><div class="muted">Agregado</div><h1>${esc(S.ag.nome)}</h1></div>
      ${isAdmin() ? '<button class="link" data-act="renomearAg">Renomear</button>' : ''}</div>

    <div class="card" style="padding:2px 16px">${S.membros.map(m => `
      <div class="item">
        <span class="badge" style="border-radius:20px;background:${m.user_id === S.user.id ? 'var(--accent)' : 'var(--orange)'};color:#fff">${esc(sigla(m.nome))}</span>
        <span class="grow"><b class="ellip" style="display:block">${esc(m.nome)}${m.user_id === S.user.id ? ' (tu)' : ''}</b><span class="muted small ellip" style="display:block">${esc(m.email || '')}</span></span>
        ${isAdmin() && m.user_id !== S.user.id
          ? `<select class="input" style="width:auto;min-height:38px" data-chg="perfilMembro" data-id="${m.user_id}" aria-label="Perfil de ${esc(m.nome)}">${Object.keys(PERFIS).map(p => `<option value="${p}" ${p === m.perfil ? 'selected' : ''}>${PERFIS[p]}</option>`).join('')}</select>
             <button class="link" style="color:var(--warn)" data-act="removerMembro" data-id="${m.user_id}" aria-label="Remover ${esc(m.nome)}">✕</button>`
          : `<span class="tag" style="background:var(--accent-soft);color:var(--accent)">${PERFIS[m.perfil]}</span>`}
      </div>`).join('')}
      ${S.convites.map(c => `<div class="item">
        <span class="badge" style="border-radius:20px;background:#ECEEEA;color:#3C4842">?</span>
        <span class="grow"><b class="ellip" style="display:block">${esc(c.nome)}</b><span class="muted small ellip" style="display:block">${esc(c.email)} · convite pendente</span></span>
        <span class="tag" style="background:#ECEEEA;color:#3C4842">${PERFIS[c.perfil]}</span>
        <button class="link" style="color:var(--warn)" data-act="apagarConvite" data-id="${c.id}" aria-label="Cancelar convite">✕</button>
      </div>`).join('')}
    </div>

    ${isAdmin() ? `<form id="fConv" class="card stack" style="gap:10px">
      <b>Convidar membro</b>
      <div class="field"><label for="cvNome">Nome</label><input class="input" id="cvNome" maxlength="60" required></div>
      <div class="field"><label for="cvEmail">Email</label><input class="input" id="cvEmail" type="email" required></div>
      <div class="field"><label for="cvPerfil">Perfil</label><select class="input" id="cvPerfil"><option value="membro">Membro — regista e edita as suas</option><option value="leitura">Leitura — só consulta</option><option value="admin">Admin — gere tudo</option></select></div>
      <button class="btn dashed" type="submit">+ Enviar convite</button>
      <div class="muted small">A app não envia email: manda-lhe o link da app. Quando criar conta com este email, entra automaticamente nesta casa.</div>
    </form>
    <button class="btn sec" data-act="casaView" data-v="cats">Gerir categorias e subcategorias</button>` : ''}

    ${outras.length ? `<div class="card stack" style="gap:8px"><b>Outras casas</b>${outras.map(o => `<button class="btn sec" data-act="trocarAg" data-id="${o.agregado_id}">${esc(o.agregados ? o.agregados.nome : 'Casa')}</button>`).join('')}</div>` : ''}

    <button class="btn sec" data-act="sair">Terminar sessão</button>
    <div class="muted small" style="text-align:center">${esc(S.user.email)} · ${VERSAO}</div>
  </div>`;
}

function vCategorias() {
  return `<div class="stack">
    <div class="row between"><h1>Categorias</h1><button class="link" data-act="casaView" data-v="main">Fechar</button></div>
    <div class="muted small">Arquivar esconde a categoria ou subcategoria no registo, mas mantém o histórico.</div>
    ${S.cats.map(c => `<div class="card stack ${c.ativa ? '' : 'arch'}" style="gap:8px">
      <div class="row between">
        <span class="row" style="gap:8px"><span style="width:14px;height:14px;border-radius:7px;background:${c.cor};display:inline-block"></span><b>${esc(c.nome)}</b></span>
        <span class="row" style="gap:4px">
          <button class="link" data-act="renomearCat" data-id="${c.id}">Renomear</button>
          <button class="link" data-act="arquivarCat" data-id="${c.id}">${c.ativa ? 'Arquivar' : 'Repor'}</button>
        </span>
      </div>
      <div class="row" style="gap:8px"><label class="muted small" for="irs-${c.id}">IRS</label>
        <select class="input" id="irs-${c.id}" style="min-height:38px" data-chg="irsCat" data-id="${c.id}">${Object.keys(IRS).map(k => `<option value="${k}" ${k === c.irs ? 'selected' : ''}>${IRS[k]}</option>`).join('')}</select></div>
      <div class="chips">${S.subs.filter(s => s.categoria_id === c.id).map(s => `<button class="chip sm ${s.ativa ? '' : 'arch'}" data-act="menuSub" data-id="${s.id}">${esc(s.nome)}</button>`).join('')}
        <button class="chip sm" style="color:var(--accent);border-style:dashed" data-act="novaSub" data-id="${c.id}">+ Subcategoria</button></div>
    </div>`).join('')}
    <button class="btn dashed" data-act="novaCat">+ Nova categoria</button>
  </div>`;
}

/* =====================================================================
   AÇÕES
   ===================================================================== */
const A = {
  authModo: (el) => { S.authModo = el.dataset.m; S.authMsg = ''; renderAuth(); },
  sair: async () => { await sb.auth.signOut(); },
  tab: (el) => {
    lerCamposForm();
    S.tab = el.dataset.t; if (S.tab !== 'casa') S.casaView = 'main';
    render();
  },
  mes: async (el) => { S.mes = new Date(S.mes.getFullYear(), S.mes.getMonth() + Number(el.dataset.d), 1); S.aberta = null; await carregarMes(); render(); },
  editar: (el) => { const d = S.despesas.find(x => x.id === el.dataset.id); if (!d || !podeEditar(d)) return; formDe(d); S.tab = 'nova'; render(); },
  cancelarEdicao: () => { novoForm(); S.tab = 'inicio'; render(); },
  cat: (el) => { lerCamposForm(); if (S.form.cat !== el.dataset.id) { S.form.cat = el.dataset.id; S.form.sub = null; } render.manterScroll = true; render(); },
  sub: (el) => { lerCamposForm(); S.form.sub = (S.form.sub === el.dataset.id) ? null : el.dataset.id; render.manterScroll = true; render(); },
  pago: (el) => { lerCamposForm(); S.form.pago = el.dataset.id; render.manterScroll = true; render(); },
  tecla: (el) => tecla(el.dataset.k),
  guardar: guardar,
  apagar: apagar,
  toggleCat: (el) => { S.aberta = S.aberta === el.dataset.id ? null : el.dataset.id; render.manterScroll = true; render(); },
  exportar: exportarCSV,
  casaView: (el) => { S.casaView = el.dataset.v; render(); },
  trocarAg: async (el) => { S.mes = inicioMes(new Date()); S.casaView = 'main'; S.tab = 'inicio'; await abrirAgregado(el.dataset.id); },
  renomearAg: async () => {
    const n = prompt('Nome da casa', S.ag.nome); if (!n || !n.trim()) return;
    const { error } = await sb.from('agregados').update({ nome: n.trim() }).eq('id', S.ag.id); if (error) return erro(error);
    S.ag.nome = n.trim(); const l = S.ligacoes.find(x => x.agregado_id === S.ag.id); if (l && l.agregados) l.agregados.nome = n.trim(); render();
  },
  removerMembro: async (el) => {
    const m = S.membros.find(x => x.user_id === el.dataset.id); if (!m || !confirm('Remover ' + m.nome + ' desta casa? As despesas que registou ficam.')) return;
    const { error } = await sb.from('membros').delete().eq('agregado_id', S.ag.id).eq('user_id', m.user_id); if (error) return erro(error);
    await carregarBase(); render();
  },
  apagarConvite: async (el) => {
    if (!confirm('Cancelar este convite?')) return;
    const { error } = await sb.from('convites').delete().eq('id', el.dataset.id); if (error) return erro(error);
    await carregarConvites(); render();
  },
  novaCat: async () => {
    const n = prompt('Nome da nova categoria'); if (!n || !n.trim()) return;
    const ordem = S.cats.reduce((a, c) => Math.max(a, c.ordem), 0) + 1;
    const cor = PALETA[S.cats.length % PALETA.length];
    const { error } = await sb.from('categorias').insert({ agregado_id: S.ag.id, nome: n.trim(), cor, ordem }); if (error) return erro(error);
    await carregarBase(); render.manterScroll = true; render();
  },
  renomearCat: async (el) => {
    const c = catById(el.dataset.id); const n = prompt('Nome da categoria', c.nome); if (!n || !n.trim()) return;
    const { error } = await sb.from('categorias').update({ nome: n.trim() }).eq('id', c.id); if (error) return erro(error);
    await carregarBase(); render.manterScroll = true; render();
  },
  arquivarCat: async (el) => {
    const c = catById(el.dataset.id);
    const { error } = await sb.from('categorias').update({ ativa: !c.ativa }).eq('id', c.id); if (error) return erro(error);
    await carregarBase(); if (!catById(S.form.cat) || !catById(S.form.cat).ativa) novoForm(); render.manterScroll = true; render();
  },
  novaSub: async (el) => {
    const c = catById(el.dataset.id); const n = prompt('Nova subcategoria de ' + c.nome); if (!n || !n.trim()) return;
    const ordem = S.subs.filter(s => s.categoria_id === c.id).reduce((a, s) => Math.max(a, s.ordem), 0) + 1;
    const { error } = await sb.from('subcategorias').insert({ agregado_id: S.ag.id, categoria_id: c.id, nome: n.trim(), ordem }); if (error) return erro(error);
    await carregarBase(); render.manterScroll = true; render();
  },
  menuSub: async (el) => {
    const s = subById(el.dataset.id);
    const n = prompt(`"${s.nome}": escreve um novo nome para renomear, ou deixa em branco e OK para ${s.ativa ? 'arquivar' : 'repor'}.`, s.nome);
    if (n === null) return;
    let res;
    if (n.trim() === '') res = await sb.from('subcategorias').update({ ativa: !s.ativa }).eq('id', s.id);
    else if (n.trim() !== s.nome) res = await sb.from('subcategorias').update({ nome: n.trim() }).eq('id', s.id);
    else return;
    if (res.error) return erro(res.error);
    await carregarBase(); render.manterScroll = true; render();
  }
};

const CHG = {
  perfilMembro: async (el) => {
    const { error } = await sb.from('membros').update({ perfil: el.value }).eq('agregado_id', S.ag.id).eq('user_id', el.dataset.id);
    if (error) { erro(error); } await carregarBase(); render.manterScroll = true; render();
  },
  irsCat: async (el) => {
    const { error } = await sb.from('categorias').update({ irs: el.value }).eq('id', el.dataset.id);
    if (error) erro(error); await carregarBase(); render.manterScroll = true; render();
  }
};

document.addEventListener('click', (ev) => {
  const el = ev.target.closest('[data-act]'); if (!el) return;
  const f = A[el.dataset.act]; if (!f) return;
  ev.preventDefault(); Promise.resolve(f(el)).catch(erro);
});
document.addEventListener('change', (ev) => {
  const el = ev.target.closest('[data-chg]'); if (!el) return;
  const f = CHG[el.dataset.chg]; if (f) Promise.resolve(f(el)).catch(erro);
});
document.addEventListener('submit', async (ev) => {
  if (ev.target.id !== 'fConv') return;
  ev.preventDefault();
  const nome = document.getElementById('cvNome').value.trim(), email = document.getElementById('cvEmail').value.trim().toLowerCase(), perfil = document.getElementById('cvPerfil').value;
  if (S.membros.some(m => (m.email || '').toLowerCase() === email)) return toast('Essa pessoa já é membro');
  const { error } = await sb.from('convites').insert({ agregado_id: S.ag.id, nome, email, perfil });
  if (error) return erro(/duplicate/i.test(error.message) ? { message: 'Já existe um convite para esse email' } : error);
  toast('Convite criado. Envia-lhe o link da app.'); await carregarConvites(); render.manterScroll = true; render();
});

/* ---------- exportação CSV (Excel PT: ponto e vírgula, vírgula decimal) ---------- */
function exportarCSV() {
  const q = (v) => '"' + String(v == null ? '' : v).replace(/"/g, '""') + '"';
  const linhas = [['Data', 'Valor', 'Categoria', 'Subcategoria', 'Descrição', 'Pago por', 'Registado por', 'IRS'].map(q).join(';')];
  S.despesas.slice().reverse().forEach(d => {
    const c = catById(d.categoria_id) || {}, s = d.subcategoria_id ? subById(d.subcategoria_id) : null;
    linhas.push([d.data, String(Number(d.valor).toFixed(2)).replace('.', ','), c.nome, s ? s.nome : '', d.descricao || '', nomeMembro(d.pago_por), nomeMembro(d.registado_por), IRS[c.irs] || ''].map(q).join(';'));
  });
  const blob = new Blob(['﻿' + linhas.join('\r\n')], { type: 'text/csv;charset=utf-8' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'despesas-' + S.mes.getFullYear() + '-' + pad(S.mes.getMonth() + 1) + '.csv';
  document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 500);
}

/* ---------- ciclo de vida ---------- */
sb.auth.onAuthStateChange(async (evento, session) => {
  if (evento === 'PASSWORD_RECOVERY') {
    const p = prompt('Nova palavra-passe (mínimo 8 caracteres)');
    if (p && p.length >= 8) { const { error } = await sb.auth.updateUser({ password: p }); toast(error ? error.message : 'Palavra-passe alterada'); }
  }
  if (evento === 'SIGNED_OUT' || !session) { arrancado = false; S.user = null; S.authModo = 'entrar'; renderAuth(); return; }
  if (!arrancado && (evento === 'INITIAL_SESSION' || evento === 'SIGNED_IN')) {
    arrancado = true;
    setTimeout(() => arrancar(session).catch(erro), 0);   // fora do callback para evitar bloqueio do supabase-js
  }
});

document.addEventListener('visibilitychange', async () => {
  if (document.visibilityState === 'visible' && S.ag && S.tab !== 'nova') {
    try { await carregarMes(); render.manterScroll = true; render(); } catch (e) {}
  }
});

/* manifest gerado em tempo de execução (instalar no ecrã principal) */
(function () {
  const m = { name: 'Despesas da Casa', short_name: 'Despesas', start_url: location.href.split('#')[0].split('?')[0], display: 'standalone', background_color: '#F4F5F2', theme_color: '#F4F5F2' };
  const l = document.createElement('link'); l.rel = 'manifest';
  l.href = URL.createObjectURL(new Blob([JSON.stringify(m)], { type: 'application/manifest+json' }));
  document.head.appendChild(l);
})();
</script>
